<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — Limited Time</title>
  <meta name="description" content="Grab 40% off shipping. Limited time offer.">
  <meta name="author" content="USFans">
  <link rel="preload" as="image" href="images/usfans-wzr06cld.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: oklch(13% 0.02 25);
      --foreground: oklch(97% 0.01 20);
      --muted-foreground: oklch(70% 0.03 25);
      --ember: oklch(62% 0.26 25);
      --ember-glow: oklch(70% 0.28 22);
      --border-glow: oklch(62% 0.26 25 / 0.4);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .relative { position: relative; }
    .min-h-screen { min-height: 100vh; }
    .overflow-hidden { overflow: hidden; }
    .bg-radial-glow { pointer-events: none; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, oklch(0.3 0.15 25 / 0.35), transparent 55%),
                  radial-gradient(ellipse at 80% 80%, oklch(0.25 0.18 22 / 0.3), transparent 60%);
    }
    .noise-overlay {
      pointer-events: none; position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    }
    .snowflakes-container { pointer-events: none; position: fixed; inset: 0; overflow: hidden; z-index: 2; }
    .snowflake {
      filter: blur(0.5px); pointer-events: none;
      background: radial-gradient(circle, #ff6266e6, #d4092400);
      border-radius: 9999px; animation: linear infinite snowfall; position: absolute; top: 0;
    }
    @keyframes snowfall {
      0% { opacity: 0; transform: translateY(-10vh) translate(0); }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      to { transform: translateY(110vh) translate(var(--drift, 20px)); opacity: 0; }
    }
    @keyframes shimmer { 0% { background-position: -200%; } to { background-position: 200%; } }
    .shimmer-text {
      -webkit-text-fill-color: transparent;
      background: linear-gradient(90deg,#fa002a,#ff303c,#ff474c 12.5%,#ff7a75 25%,#ffb7b3,#ff7a75 75%,#ff474c 87.5%,#ff303c,#fa002a) 0 0 / 200%;
      background-clip: text; -webkit-background-clip: text; animation: 3s linear infinite shimmer;
    }
    .promo-link-button {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; max-width: 960px; margin: 0 auto; text-decoration: none; cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), filter 0.2s;
    }
    .promo-link-button:hover { transform: scale(1.02); }
    .promo-bar-inner {
      position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 1.2rem 2rem; border-radius: 9999px; padding: 0.9rem 2.2rem; backdrop-filter: blur(28px);
      background: linear-gradient(90deg, oklch(0.18 0.04 25 / 0.98), oklch(1 0 0 / 0.08), oklch(0.18 0.04 25 / 0.98));
      box-shadow: 0 0 0 1px var(--border-glow), 0 0 18px oklch(0.62 0.26 25 / 0.25), 0 0 55px oklch(0.62 0.26 25 / 0.2);
    }
    .glow-overlay {
      pointer-events: none; position: absolute; inset: 0; border-radius: 9999px;
      background: radial-gradient(circle, oklch(0.62 0.26 25 / 0.5), transparent 70%); opacity: 0.6;
    }
    .promo-text-group {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 1rem;
      font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--foreground);
    }
    .discount-text {
      font-family: var(--font-display); font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, #ffb7b3, #ff7a75, #ff474c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .separator { width: 1px; height: 24px; background-color: oklch(0.62 0.26 25 / 0.5); }
    .badge-limited { font-size: 0.7rem; letter-spacing: 0.3em; color: var(--muted-foreground); }
    .action-hint {
      display: flex; align-items: center; gap: 0.6rem;
      background: oklch(0.62 0.26 25 / 0.22); padding: 0.55rem 1.3rem; border-radius: 40px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ember-glow);
    }
    .logo-section { display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 3rem 1rem 2rem; }
    .logo-img { width: 96px; height: 96px; border-radius: 1.5rem; object-fit: contain; }

    #google-login-wrapper { position: absolute; top: 1.5rem; right: 1.5rem; z-index: 100; }
    #admin-panel {
      width: 100%; max-width: 960px; margin: 1.2rem auto 2rem; padding: 1.8rem;
      background: rgba(250, 0, 42, 0.15); border: 1px solid oklch(0.62 0.26 25 / 0.6);
      border-radius: 16px; display: none;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #ff7a75; }
    .form-input {
      width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: white;
    }
    #qc-drop-zone {
      border: 2px dashed #ff474c; padding: 2rem; text-align: center;
      border-radius: 12px; cursor: pointer;
    }
    #qc-drop-zone.dragover { background: rgba(255,71,76,0.15); border-color: #ff7a75; }
    #qc-preview { max-width: 100%; max-height: 300px; margin-top: 1rem; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <main class="relative min-h-screen overflow-hidden">
    <div class="bg-radial-glow"></div>
    <div class="noise-overlay"></div>
    <div class="snowflakes-container" aria-hidden="true">
      <!-- Snowflakes (kept) -->
      <span class="snowflake" style="left:0.62%;width:1.9px;height:1.9px;animation-duration:10.3s;animation-delay:-2.4s;opacity:0.62;--drift:32px"></span>
      <!-- ... other snowflakes ... -->
    </div>

    <h1 class="sr-only">40% Off Shipping — Limited Time</h1>

    <div id="google-login-wrapper" style="margin-top:1.5rem;display:flex;justify-content:center;">
      <div id="google-login-button"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel">
      <h2 style="color:#ff474c; text-align:center; margin-bottom:1.5rem;">XyLo BOT - Add New Listing</h2>
      <div class="form-group">
        <label>Product Link</label>
        <input type="text" id="product-link" class="form-input" placeholder="https://www.usfans.com/product/...">
      </div>
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="product-name" class="form-input" placeholder="Enter product name">
      </div>
      <div class="form-group">
        <label>Product QC Pics (Drag & Drop)</label>
        <div id="qc-drop-zone">Drop image here or click to upload</div>
        <img id="qc-preview" alt="Preview">
      </div>
      <button onclick="submitListing()" style="width:100%; padding:1rem; background:#ff474c; color:white; border:none; border-radius:999px; font-weight:700; cursor:pointer;">ADD TO SPREADSHEET</button>
    </div>

    <div class="logo-section">
      <img src="images/usfans-wzr06cld.webp" alt="USFans" class="logo-img">

      <a href="https://www.usfans.com/register?ref=2TQXNA" id="exclusive-offer-button" class="promo-link-button" target="_blank" rel="noopener noreferrer">
        <div class="promo-bar-inner">
          <div class="glow-overlay"></div>
          <div class="promo-text-group">
            <span>Grab your</span>
            <span class="discount-text shimmer-text">40% OFF</span>
            <span>shipping</span>
            <div class="separator"></div>
            <span class="badge-limited">Limited time</span>
          </div>
          <div class="action-hint"><span>Register now →</span></div>
        </div>
      </a>

      <a href="SpreadSheet.html" class="promo-link-button" style="margin-top: 1rem;" target="_blank" rel="noopener noreferrer">
        <div class="promo-bar-inner">
          <div class="glow-overlay"></div>
          <div class="promo-text-group">
            <span>Check out our</span>
            <span class="discount-text shimmer-text">SPREADSHEET</span>
          </div>
          <div class="action-hint"><span>View Now →</span></div>
        </div>
      </a>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function () {
      const removeLovableElements = () => document.querySelectorAll('#lovable-badge, [id*="lovable-badge"], .lovable-badge').forEach(el => el.remove());
      removeLovableElements();

      function handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        const user = { name: payload.name, email: payload.email, picture: payload.picture };
        localStorage.setItem("google_user", JSON.stringify(user));
        showUser(user);
      }

      function showUser(user) {
        const wrapper = document.getElementById("google-login-wrapper");
        wrapper.innerHTML = `<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.06);padding:12px 18px;border-radius:999px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);"><img src="${user.picture}" style="width:42px;height:42px;border-radius:50%;"><div style="display:flex;flex-direction:column;"><span style="font-weight:700;color:white;font-size:14px;">${user.name}</span><span style="font-size:12px;opacity:0.7;color:white;">${user.email}</span></div></div>`;

        if (user.name === "XyLo BOT" || (user.picture && user.picture.toLowerCase().endsWith('.gif'))) {
          document.getElementById('admin-panel').style.display = 'block';
          setupDragDrop();
        }
      }

      function setupDragDrop() {
        const zone = document.getElementById('qc-drop-zone');
        const preview = document.getElementById('qc-preview');
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
        zone.addEventListener('drop', e => {
          e.preventDefault(); zone.classList.remove('dragover');
          const file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = ev => { preview.src = ev.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(file);
          }
        });
      }

      window.submitListing = function() {
        let link = document.getElementById('product-link').value.trim();
        const name = document.getElementById('product-name').value.trim();

        if (!link || !name) {
          alert("Please fill both Link and Name");
          return;
        }

        if (!link.includes('ref=2TQXNA')) {
          link += (link.includes('?') ? '&' : '?') + 'ref=2TQXNA';
        }

        // Save to localStorage
        let listings = JSON.parse(localStorage.getItem("usfans_listings") || "[]");
        listings.push({ link, name, date: new Date().toLocaleString() });
        localStorage.setItem("usfans_listings", JSON.stringify(listings));

        console.log("✅ Listing added to Spreadsheet");
        console.log({ link: link, name: name });
        console.log("1. link: \"" + link + "\"");
        console.log("2. name: \"" + name + "\"");
        console.log("3. [[Prototype]]: Object");

        alert("✅ Listing successfully added to Spreadsheet!");
        
        // Clear fields after adding
        document.getElementById('product-link').value = '';
        document.getElementById('product-name').value = '';
        document.getElementById('qc-preview').style.display = 'none';
      };

      window.addEventListener("load", () => {
        google.accounts.id.initialize({
          client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
          callback: handleCredentialResponse
        });
        google.accounts.id.renderButton(document.getElementById("google-login-button"), {
          theme: "filled_black", size: "large", shape: "pill", width: 260
        });
        google.accounts.id.prompt();

        const savedUser = localStorage.getItem("google_user");
        if (savedUser) showUser(JSON.parse(savedUser));
      });
    })();
  </script>
</body>
</html>
