<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — User Dashboard</title>
  <meta name="description" content="Grab 40% off shipping. Limited time offer. User-specific product listings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: oklch(13% 0.02 25);
      --foreground: oklch(97% 0.01 20);
      --muted-foreground: oklch(70% 0.03 25);
      --ember: oklch(62% 0.26 25);
      --ember-glow: oklch(70% 0.28 22);
      --border-glow: oklch(62% 0.26 25 / 0.4);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-radial-glow {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, oklch(0.3 0.15 25 / 0.35), transparent 55%),
                  radial-gradient(ellipse at 80% 80%, oklch(0.25 0.18 22 / 0.3), transparent 60%);
      z-index: 0;
    }
    .noise-overlay {
      pointer-events: none; position: fixed; inset: 0; opacity: 0.04; mix-blend-mode: overlay; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    }
    .snowflakes-container {
      pointer-events: none; position: fixed; inset: 0; overflow: hidden; z-index: 2;
    }
    .snowflake {
      filter: blur(0.5px); pointer-events: none;
      background: radial-gradient(circle, #ff6266e6, #d4092400);
      border-radius: 9999px; animation: linear infinite snowfall; position: absolute; top: 0;
    }
    @keyframes snowfall {
      0% { opacity: 0; transform: translateY(-10vh) translate(0); }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      to { transform: translateY(110vh) translate(var(--drift, 20px)); opacity: 0; }
    }
    .shimmer-text {
      -webkit-text-fill-color: transparent;
      background: linear-gradient(90deg, #fa002a, #ff303c, #ff474c 12.5%, #ff7a75 25%, #ffb7b3, #ff7a75 75%, #ff474c 87.5%, #ff303c, #fa002a) 0 0 / 200%;
      background-clip: text; -webkit-background-clip: text; animation: 3s linear infinite shimmer;
    }
    .promo-link-button {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; max-width: 960px; margin: 0 auto; text-decoration: none; cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .promo-link-button:hover { transform: scale(1.02); }
    .promo-bar-inner {
      position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 1.2rem 2rem; border-radius: 9999px; padding: 0.9rem 2.2rem; backdrop-filter: blur(28px);
      background: linear-gradient(90deg, oklch(0.18 0.04 25 / 0.98), oklch(1 0 0 / 0.08), oklch(0.18 0.04 25 / 0.98));
      box-shadow: 0 0 0 1px var(--border-glow), 0 0 18px oklch(0.62 0.26 25 / 0.25);
    }
    .glow-overlay {
      pointer-events: none; position: absolute; inset: 0; border-radius: 9999px;
      background: radial-gradient(circle, oklch(0.62 0.26 25 / 0.5), transparent 70%); opacity: 0.6;
    }
    .promo-text-group {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 1rem;
      font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    }
    .discount-text {
      font-family: var(--font-display); font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, #ffb7b3, #ff7a75, #ff474c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .action-hint {
      display: flex; align-items: center; gap: 0.6rem;
      background: oklch(0.62 0.26 25 / 0.22); padding: 0.55rem 1.3rem; border-radius: 40px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.2em;
    }
    .logo-section { display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 3rem 1rem 2rem; position: relative; z-index: 3; }
    .logo-img { width: 96px; height: 96px; border-radius: 1.5rem; object-fit: contain; }

    /* Auth & Admin Styles */
    .auth-header {
      position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100; display: flex; gap: 1rem; align-items: center;
    }
    .user-avatar {
      width: 48px; height: 48px; border-radius: 50%; border: 2px solid #ff474c; cursor: pointer;
      transition: transform 0.2s; object-fit: cover;
    }
    .user-avatar:hover { transform: scale(1.05); }
    .logout-btn {
      background: rgba(0,0,0,0.6); border: 1px solid #ff474c; color: #ffb7b3; padding: 8px 16px;
      border-radius: 40px; cursor: pointer; font-size: 0.8rem; backdrop-filter: blur(8px);
    }
    #admin-panel {
      width: 100%; max-width: 960px; margin: 1.2rem auto 2rem; padding: 1.8rem;
      background: rgba(250, 0, 42, 0.15); backdrop-filter: blur(12px);
      border: 1px solid oklch(0.62 0.26 25 / 0.6); border-radius: 32px;
      position: relative; z-index: 3; transition: all 0.3s;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #ff7a75; }
    .form-input {
      width: 100%; padding: 0.85rem 1rem; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 71, 76, 0.5); border-radius: 20px; color: white;
      font-family: var(--font-sans); font-size: 0.95rem;
    }
    .form-input:focus { outline: none; border-color: #ff7a75; box-shadow: 0 0 0 2px rgba(255, 71, 76, 0.3); }
    #qc-drop-zone {
      border: 2px dashed #ff474c; padding: 1.8rem; text-align: center;
      border-radius: 24px; cursor: pointer; background: rgba(0,0,0,0.3);
    }
    #qc-drop-zone.dragover { background: rgba(255, 71, 76, 0.2); border-color: #ff7a75; }
    #qc-preview { max-width: 100%; max-height: 260px; margin-top: 1rem; border-radius: 20px; display: none; }
    .btn-submit {
      width:100%; padding: 1rem; background: linear-gradient(95deg, #ff474c, #e63e42);
      border: none; border-radius: 60px; font-weight: 800; cursor: pointer; font-size: 1rem;
      transition: 0.2s; color: white;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .user-welcome {
      text-align: center; margin-bottom: 1rem; color: #ffb7b3; font-size: 0.9rem;
      background: rgba(0,0,0,0.4); padding: 6px; border-radius: 40px;
    }
    .toast-msg {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a1f2e; backdrop-filter: blur(20px); padding: 12px 28px;
      border-radius: 60px; border-left: 6px solid #ff474c; z-index: 999;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .spreadsheet-link {
      margin-top: 1rem; text-align: center;
    }
    .spreadsheet-link a {
      color: #ff7a75; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-radial-glow"></div>
  <div class="noise-overlay"></div>
  <div class="snowflakes-container" aria-hidden="true">
    <span class="snowflake" style="left:0.62%;width:1.9px;height:1.9px;animation-duration:10.3s;--drift:32px"></span>
    <span class="snowflake" style="left:36.9%;width:2.15px;animation-duration:8.38s;--drift:-17px"></span>
    <span class="snowflake" style="left:33.36%;width:2.96px;animation-duration:8.51s;--drift:10px"></span>
  </div>

  <div class="auth-header">
    <div id="google-login-button"></div>
    <div id="user-profile" style="display: none;">
      <img id="user-avatar" class="user-avatar" alt="avatar">
      <button id="logout-btn" class="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="logo-section">
    <img src="images/usfans-wzr06cld.webp" alt="USFans" class="logo-img">
    <a href="https://www.usfans.com/register?ref=2TQXNA" class="promo-link-button" target="_blank">
      <div class="promo-bar-inner">
        <div class="glow-overlay"></div>
        <div class="promo-text-group">
          <span>Grab your</span>
          <span class="discount-text shimmer-text">40% OFF</span>
          <span>shipping</span>
          <div class="action-hint"><span>Register now →</span></div>
        </div>
      </div>
    </a>
  </div>

  <!-- Admin Panel - Only visible when logged in -->
  <div id="admin-panel" style="display: none;">
    <div id="user-welcome" class="user-welcome"></div>
    <h2 style="color:#ff474c; text-align:center; margin-bottom:1.5rem;">✨ Add New Product Listing</h2>
    <div class="form-group">
      <label>Product Link (auto-adds ?ref=2TQXNA)</label>
      <input type="text" id="product-link" class="form-input" placeholder="https://www.usfans.com/product/...">
    </div>
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="product-name" class="form-input" placeholder="Enter product name">
    </div>
    <div class="form-group">
      <label>QC Preview (optional drag & drop)</label>
      <div id="qc-drop-zone">📸 Drop image or click to preview</div>
      <img id="qc-preview" alt="Preview">
    </div>
    <button id="submitBtn" class="btn-submit">➕ ADD TO MY LISTINGS</button>
    <div class="spreadsheet-link">
      <a href="SpreadSheet.html" target="_blank">📊 View All Listings (Spreadsheet)</a>
    </div>
  </div>

  <div id="toast" class="toast-msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Supabase config
    const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6_2ZEDiDiWI6ShtNGz8DsQ_zpR5A6sF";
    const supabase = window.Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null; // Stores { id, email, name, picture }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.backgroundColor = isError ? '#3b141c' : '#1a3324';
      toast.style.borderLeftColor = isError ? '#ff474c' : '#6bff9b';
      toast.style.opacity = '1';
      setTimeout(() => toast.style.opacity = '0', 3000);
    }

    // Update UI based on login state
    function updateUIForUser(user) {
      const adminPanel = document.getElementById('admin-panel');
      const googleBtnDiv = document.getElementById('google-login-button');
      const userProfileDiv = document.getElementById('user-profile');
      
      if (user) {
        // Logged in: show admin panel, hide Google button, show profile
        adminPanel.style.display = 'block';
        googleBtnDiv.style.display = 'none';
        userProfileDiv.style.display = 'flex';
        document.getElementById('user-avatar').src = user.picture;
        document.getElementById('user-welcome').innerHTML = `👋 Welcome, ${user.name} · <span style="font-size:0.8rem;">${user.email}</span>`;
        showToast(`✅ Signed in as ${user.name}`, false);
      } else {
        // Logged out: hide admin panel, show Google button, hide profile
        adminPanel.style.display = 'none';
        googleBtnDiv.style.display = 'block';
        userProfileDiv.style.display = 'none';
      }
    }

    // Submit listing with user_id attached
    async function submitListing() {
      if (!currentUser) {
        showToast("⚠️ Please sign in with Google first", true);
        return;
      }

      const linkInput = document.getElementById('product-link');
      const nameInput = document.getElementById('product-name');
      let link = linkInput.value.trim();
      const name = nameInput.value.trim();

      if (!link || !name) {
        showToast("❌ Please fill both Product Link and Name", true);
        return;
      }

      // Auto-add ref=2TQXNA
      if (!link.includes('ref=2TQXNA')) {
        link += (link.includes('?') ? '&' : '?') + 'ref=2TQXNA';
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ SAVING...";

      try {
        // CRITICAL: Store listing with user_id from Google Account
        const { data, error } = await supabase
          .from('listings')
          .insert([{
            link: link,
            name: name,
            user_id: currentUser.id,        // Google unique ID
            user_email: currentUser.email,   // Extra for filtering
            created_at: new Date().toISOString()
          }]);

        if (error) throw error;

        showToast(`✅ Listing "${name}" added to your spreadsheet!`, false);
        console.log(`User ${currentUser.email} added listing:`, { link, name });
        
        // Clear form
        linkInput.value = '';
        nameInput.value = '';
        const preview = document.getElementById('qc-preview');
        preview.style.display = 'none';
        preview.src = '';
        
      } catch (err) {
        console.error("Supabase error:", err);
        showToast(`❌ Failed: ${err.message}`, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "➕ ADD TO MY LISTINGS";
      }
    }

    // Google Sign-In success callback
    function handleCredentialResponse(response) {
      try {
        const decoded = JSON.parse(atob(response.credential.split('.')[1]));
        // Build user object with Google's unique 'sub' as ID
        currentUser = {
          id: decoded.sub,
          email: decoded.email,
          name: decoded.name,
          picture: decoded.picture
        };
        
        // Store in localStorage to persist across pages (for SpreadSheet.html)
        localStorage.setItem('usfans_user', JSON.stringify(currentUser));
        
        updateUIForUser(currentUser);
        
        // Optional: Verify/insert user into Supabase 'users' table (for RLS later)
        // But main goal: all future listings will have user_id = currentUser.id
      } catch (e) {
        console.error("Google auth error", e);
        showToast("Login failed", true);
      }
    }

    // Logout function
    function logout() {
      currentUser = null;
      localStorage.removeItem('usfans_user');
      updateUIForUser(null);
      // Reset Google One-tap by re-prompt? Not needed, just hide UI.
      showToast("Signed out successfully", false);
      // Re-enable Google button visibility
      const googleBtnDiv = document.getElementById('google-login-button');
      if (googleBtnDiv) googleBtnDiv.style.display = 'block';
    }

    // Check for existing session from localStorage (when returning to page)
    function restoreSession() {
      const saved = localStorage.getItem('usfans_user');
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          updateUIForUser(currentUser);
        } catch(e) {}
      }
    }

    // Setup drag & drop preview (UI only)
    function setupImagePreview() {
      const dropZone = document.getElementById('qc-drop-zone');
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.style.display = 'none';
      document.body.appendChild(fileInput);
      const previewImg = document.getElementById('qc-preview');

      function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewImg.style.display = 'block';
          };
          reader.readAsDataURL(file);
        }
      }

      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (fileInput.files?.[0]) handleFile(fileInput.files[0]);
      });
      
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
        dropZone.addEventListener(ev, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });
      dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
      });
    }

    // Initialize everything after DOM ready
    window.addEventListener('load', () => {
      // Remove any lovable badges if present
      document.querySelectorAll('#lovable-badge, .lovable-badge').forEach(el => el.remove());
      
      // Setup Google Sign-In
      if (window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
          callback: handleCredentialResponse
        });
        google.accounts.id.renderButton(document.getElementById("google-login-button"), {
          theme: "filled_black", size: "large", shape: "pill", width: 260
        });
        google.accounts.id.prompt(); // one-tap
      } else {
        console.warn("Google API not loaded yet");
      }
      
      // Restore user session
      restoreSession();
      
      // Setup submit button event
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.addEventListener('click', submitListing);
      
      // Logout button
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.addEventListener('click', logout);
      
      // Image preview functionality
      setupImagePreview();
    });
  </script>
</body>
</html>
