<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — Limited Time</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: #0f0f10;
      --foreground: #ffffff;
      --muted-foreground: rgba(255,255,255,0.7);
      --ember: #ff474c;
      --ember-glow: #ff7a75;
      --border-glow: rgba(255,71,76,0.4);
    }

    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .relative { position: relative; }
    .min-h-screen { min-height: 100vh; }
    .overflow-hidden { overflow: hidden; }

    .bg-radial-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,71,76,0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255,71,76,0.12), transparent 40%);
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 6rem 1rem 2rem;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      border-radius: 20px;
      object-fit: cover;
    }

    .promo-link-button {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      text-decoration: none;
      transition: 0.25s;
    }

    .promo-link-button:hover { transform: scale(1.02); }

    .promo-bar-inner {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      border-radius: 999px;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 40px rgba(255,71,76,0.15);
    }

    .promo-text-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .discount-text {
      font-family: var(--font-display);
      font-size: 1.6rem;
      background: linear-gradient(90deg,#ffb7b3,#ff474c,#ff7a75);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .separator {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.2);
    }

    .badge-limited {
      color: var(--muted-foreground);
      font-size: 0.8rem;
    }

    .action-hint {
      background: rgba(255,71,76,0.15);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      color: var(--ember-glow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #google-login-wrapper {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 999;
    }

    #admin-panel {
      width: 100%;
      max-width: 960px;
      margin: 1rem auto 2rem;
      padding: 1.5rem;
      background: rgba(255,71,76,0.08);
      border: 1px solid rgba(255,71,76,0.3);
      border-radius: 18px;
      display: none;
    }

    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #ff7a75;
    }

    .form-input {
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
    }

    #qc-drop-zone {
      border: 2px dashed #ff474c;
      padding: 2rem;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
    }

    #qc-preview {
      max-width: 100%;
      max-height: 300px;
      margin-top: 1rem;
      border-radius: 10px;
      display: none;
    }

    .toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: white;
      padding: 12px 22px;
      border-radius: 999px;
      border-left: 5px solid #ff474c;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 9999;
    }
  </style>
</head>

<body>

<main class="relative min-h-screen overflow-hidden">

  <div class="bg-radial-glow"></div>

  <div id="google-login-wrapper">
    <div id="google-login-button"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel">

    <h2 style="margin-bottom:1.5rem; text-align:center; color:#ff474c;">
      Add New Product Listing
    </h2>

    <div class="form-group">
      <label>Product Link</label>
      <input type="text" id="product-link" class="form-input">
    </div>

    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="product-name" class="form-input">
    </div>

    <div class="form-group">
      <label>QC Picture</label>
      <div id="qc-drop-zone">Drop image here or click upload</div>
      <img id="qc-preview">
    </div>

    <button onclick="submitListing()"
      style="width:100%;padding:1rem;border:none;border-radius:999px;background:#ff474c;color:white;font-weight:700;">
      ADD TO SPREADSHEET
    </button>

  </div>

  <div class="logo-section">

    <img src="images/usfans-wzr06cld.webp" class="logo-img">

    <a href="https://www.usfans.com/register?ref=2TQXNA" class="promo-link-button" target="_blank">
      <div class="promo-bar-inner">
        <span>Grab your</span>
        <span class="discount-text">40% OFF</span>
      </div>
    </a>

    <a href="SpreadSheet.html" class="promo-link-button">
      <div class="promo-bar-inner">
        <span>Check out our</span>
        <span class="discount-text">Spreadsheet</span>
      </div>
    </a>

  </div>

</main>

<div id="toast" class="toast-msg"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let qcImage = null;

/* 🔒 ONLY YOU CAN ACCESS */
const ADMIN_EMAIL = "your@email.com";

function isAdmin(){
  return currentUser && currentUser.email === ADMIN_EMAIL;
}

function showToast(msg, error=false){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderLeftColor = error ? "#ff474c" : "#4dff88";
  t.style.opacity = "1";
  setTimeout(()=>t.style.opacity="0",3000);
}

function handleCredentialResponse(res){
  const p = JSON.parse(atob(res.credential.split(".")[1]));

  currentUser = {
    id: p.sub,
    name: p.name,
    email: p.email,
    picture: p.picture
  };

  localStorage.setItem("usfans_user", JSON.stringify(currentUser));
  showUser();
}

function showUser(){

  document.getElementById("google-login-wrapper").innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.06);padding:8px 14px;border-radius:999px;">
      <img src="${currentUser.picture}" style="width:40px;height:40px;border-radius:50%">
      <div>${currentUser.name}</div>
    </div>
  `;

  /* 🔒 ADMIN ONLY FIX */
  if(isAdmin()){
    document.getElementById("admin-panel").style.display = "block";
  }
}

document.getElementById("qc-drop-zone").onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";

  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = ev => {
      qcImage = ev.target.result;
      const img = document.getElementById("qc-preview");
      img.src = qcImage;
      img.style.display = "block";
    };

    reader.readAsDataURL(file);
  };

  input.click();
};

async function submitListing(){

  if(!isAdmin()) return showToast("Not admin", true);

  let link = document.getElementById("product-link").value.trim();
  let name = document.getElementById("product-name").value.trim();

  if(!link || !name) return showToast("Fill all fields", true);

  if(!link.includes("ref=2TQXNA")){
    link += (link.includes("?") ? "&" : "?") + "ref=2TQXNA";
  }

  const { error } = await supabaseClient.from("listings").insert([{
    link,
    name,
    qc_image: qcImage, /* ✅ FIXED IMAGE SAVE */
    user_id: currentUser.id,
    user_email: currentUser.email
  }]);

  if(error) return showToast(error.message, true);

  showToast("Added successfully!");
}

window.onload = () => {

  const saved = localStorage.getItem("usfans_user");
  if(saved){
    currentUser = JSON.parse(saved);
    showUser();
  }

  const wait = setInterval(() => {
    if(window.google){
      clearInterval(wait);

      google.accounts.id.initialize({
        client_id: "YOUR_CLIENT_ID",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("google-login-button"),
        { theme:"filled_black", size:"large" }
      );
    }
  },100);
};

</script>

</body>
</html>
