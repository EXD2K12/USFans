    <style>
        * {

        }
        :root {
            --font-sans: 'Inter', sans-serif;

        .relative {

        }
        .overflow-hidden {
            overflow: hidden;
        }
        .bg-radial-glow {
            pointer-events: none;
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(107, 142, 107, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(58, 90, 58, 0.08) 0%, transparent 60%);
        }
        .noise-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            opacity: 0.04;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
        }
        .snowflakes-container {
            pointer-events: none;
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 2;
        }
        .snowflake {
            filter: blur(0.5px);
            pointer-events: none;
            background: radial-gradient(circle, #8aaa8ae6, #3a5a3a00);
            border-radius: 9999px;
            animation: linear infinite snowfall;
            position: absolute;
            top: 0;
        }
        @keyframes snowfall {
            0% {
                opacity: 0;
                transform: translateY(-10vh) translate(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.6;
            }
            to {
                transform: translateY(110vh) translate(var(--drift, 20px));
                opacity: 0;
            }
        }
        @keyframes shimmer {
            0% {
                background-position: -200%;
            }
            to {
                background-position: 200%;
            }
        }
        .shimmer-text {
            -webkit-text-fill-color: transparent;
            background: linear-gradient(90deg, #8aaa8a, #6b8e6b, #9ab89a 12.5%, #b5d0b5 25%, #c8dfc8, #b5d0b5 75%, #9ab89a 87.5%, #6b8e6b, #8aaa8a) 0 0 / 200%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: 3s linear infinite shimmer;
        }
        .promo-link-button {
            display: flex;
            flex-direction: column;
            align-items: center;

        #qc-drop-zone {

        .sign-out-btn {
            background: rgba(107, 142, 107, 0.15);
            border: 1px solid var(--green-primary);

            padding: 0.3rem 0.8rem;

        }
        .sign-out-btn:hover {

        .add-listing-btn {
            width: 100%;

        #google-login-wrapper {

        #google-login-wrapper .user-card {

        #qc-preview-container {

        #qc-preview-container img {

        #qc-preview-container img:hover {
            transform: scale(1.04);

        /* ----- RESPONSIVE: logo stays huge on mobile too ----- */
        @media (max-width: 640px) {
            .promo-bar-inner {
                border-radius: 28px;
                padding: 0.8rem 1.2rem;

            }
            .promo-text-group {
                font-size: 0.7rem;
                gap: 0.4rem 0.7rem;
            }
            .discount-text {

            }
            .action-hint {
                font-size: 0.65rem;
                padding: 0.4rem 1rem;
            }
            #google-login-wrapper {
                top: 0.8rem;
                right: 0.8rem;
            }
            #google-login-wrapper .user-card {
                padding: 6px 12px 6px 10px;
                gap: 8px;
            }
            #google-login-wrapper .user-card img {

            }
            #google-login-wrapper .user-card .user-name {

            }
            .logo-section {
                padding: 1.5rem 0.5rem 1.5rem;

            .logo-img {

            }
            #add-listing-panel {

        }
        @media (max-width: 480px) {
            .promo-bar-inner {
                flex-direction: column;
                gap: 0.4rem;
                padding: 0.8rem 1rem;

            }
            .promo-text-group {
                justify-content: center;

            }

            }

            }

            }
        }

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js">
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer>
    </script>

    <script>
        // ---------- Firebase config ----------
        const firebaseConfig = {
            apiKey: "AIzaSyBmA63s5871OyebBRMqnrgd8b-XtfAvVoI",
            authDomain: "luxdrip-b0489.firebaseapp.com",
            projectId: "luxdrip-b0489",
            storageBucket: "luxdrip-b0489.firebasestorage.app",
            messagingSenderId: "558686841368",
            appId: "1:558686841368:web:d70848971654ae0526f16d",
            measurementId: "G-XT2JNKT7J0"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        const ADMIN_EMAIL = "emanuelnadd@gmail.com";
        const addListingPanel = document.getElementById('add-listing-panel');
        const loginWrapper = document.getElementById('google-login-wrapper');

        // ---------- Helper: store user in Firestore ----------
        async function upsertUser(uid, email, name, picture) {
            try {
                await db.collection('users').doc(uid).set({
                    email: email.toLowerCase(),
                    name: name,
                    picture: picture,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (err) {
                console.error('Error saving user to Firestore:', err);
            }
        }

        // ---------- UI update ----------
        function showUserUI(user) {
            const displayName = user.displayName || user.email;
            const photoURL = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayName);
            loginWrapper.innerHTML = `
            <div class="user-card">
              <img src="${photoURL}" alt="${displayName}">
              <span class="user-name">${displayName}</span>
              <button onclick="signOut()" class="sign-out-btn">Sign Out</button>
            </div>
          `;
            if (user.email && user.email.toLowerCase() === ADMIN_EMAIL) {
                addListingPanel.style.display = 'block';
                setupDragDrop();
            } else {
                addListingPanel.style.display = 'none';
            }
            localStorage.setItem('wtcbuy_user', JSON.stringify({
                uid: user.uid,
                email: user.email,
                name: displayName,
                picture: photoURL
            }));
        }

        window.signOut = function() {
            auth.signOut().then(() => {
                localStorage.removeItem('wtcbuy_user');
                loginWrapper.innerHTML = '<div id="google-login-button"></div>';
                addListingPanel.style.display = 'none';
                renderGSIButton();
            }).catch(err => console.error('Sign out error:', err));
        };

        // ---------- GSI callback ----------
        async function handleCredentialResponse(response) {
            const id_token = response.credential;
            try {
                const credential = firebase.auth.GoogleAuthProvider.credential(id_token);
                const result = await auth.signInWithCredential(credential);
                const user = result.user;
                await upsertUser(user.uid, user.email, user.displayName, user.photoURL);
                showUserUI(user);
            } catch (err) {
                console.error('Firebase sign-in failed:', err);
                alert('Login failed: ' + err.message);
            }
        }

        function renderGSIButton() {
            const container = document.getElementById('google-login-button');
            if (!container) return;
            container.innerHTML = '';
            google.accounts.id.renderButton(
                container, { theme: "filled_black", size: "large", shape: "pill", width: 260 }
            );
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                showUserUI(user);
            } else {
                loginWrapper.innerHTML = '<div id="google-login-button"></div>';
                renderGSIButton();
                addListingPanel.style.display = 'none';
                localStorage.removeItem('wtcbuy_user');
            }
        });

        window.addEventListener('load', () => {
            // ✅ UPDATED with the new OAuth client ID you provided
            google.accounts.id.initialize({
                client_id: "593513413601-ohrapjrkpeour4odhpr3h646pr7os181.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            if (!auth.currentUser) {
                renderGSIButton();
                google.accounts.id.prompt();
            }
        });

        // ---------- Drag & drop ----------
        function setupDragDrop() {
            const dropZone = document.getElementById('qc-drop-zone');
            const previewContainer = document.getElementById('qc-preview-container');
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true;
            let selectedFiles = [];

            function updatePreview() {
                previewContainer.innerHTML = '';
                selectedFiles.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        previewContainer.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                });
                previewContainer.style.display = selectedFiles.length ? 'flex' : 'none';
            }

            dropZone.addEventListener('click', () => input.click());
            input.addEventListener('change', () => { selectedFiles = Array.from(input.files);
                updatePreview(); });
            dropZone.addEventListener('dragover', (e) => { e.preventDefault();
                dropZone.classList.add('dragover'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                selectedFiles = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                updatePreview();
            });
            window._qcFiles = () => selectedFiles;
        }

        // ---------- Submit listing ----------
        window.submitListing = async function() {
            const user = auth.currentUser;
            if (!user) {
                alert('You must be signed in to add a listing.');
                return;
            }
            if (user.email.toLowerCase() !== ADMIN_EMAIL) {
                alert('Only the admin can add listings.');
                return;
            }

            const link = document.getElementById('product-link').value.trim();
            const name = document.getElementById('product-name').value.trim();
            const files = window._qcFiles ? window._qcFiles() : [];

            if (!link || !name) {
                alert('Product link and name are required');
                return;
            }

            if (files.length === 0) {
                alert('No images selected. The listing will be added without QC pictures.');
            }

            const finalLink = link; // no automatic referral code

            const qcImageUrls = [];
            for (const file of files) {
                try {
                    const fileName = `${user.uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                    const storageRef = storage.ref('qc-images/' + fileName);
                    const snapshot = await storageRef.put(file);
                    const downloadURL = await snapshot.ref.getDownloadURL();
                    qcImageUrls.push(downloadURL);
                } catch (err) {
                    console.error('Upload error:', err);
                    alert('Image upload failed: ' + err.message);
                }
            }

            try {
                await db.collection('listings').add({
                    userId: user.uid,
                    name: name,
                    link: finalLink,
                    qc_image_url: qcImageUrls,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Listing added successfully!' + (qcImageUrls.length ? '' : ' (no images uploaded)'));
                document.getElementById('product-link').value = '';
                document.getElementById('product-name').value = '';
                document.getElementById('qc-preview-container').innerHTML = '';
                const qcFilesFn = window._qcFiles;
                if (qcFilesFn) { const arr = qcFilesFn();
                    arr.length = 0; }
            } catch (err) {
                console.error('Firestore insert error:', err);
                alert('Failed to add listing: ' + err.message);
            }
        };

        console.log('🔥 Firebase ready – WTCBuy');
    </script>
</body>
</html>
