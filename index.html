<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — Limited Time</title>
  <meta name="description" content="Grab 40% off shipping. Limited time offer.">
  <meta name="author" content="USFans">
  <link rel="preload" as="image" href="images/usfans-wzr06cld.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: oklch(13% 0.02 25);
      --foreground: oklch(97% 0.01 20);
      --muted-foreground: oklch(70% 0.03 25);
      --ember: oklch(62% 0.26 25);
      --ember-glow: oklch(70% 0.28 22);
      --border-glow: oklch(62% 0.26 25 / 0.4);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .relative {
      position: relative;
    }
    .min-h-screen {
      min-height: 100vh;
    }
    .overflow-hidden {
      overflow: hidden;
    }
    .bg-radial-glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, oklch(0.3 0.15 25 / 0.35), transparent 55%),
        radial-gradient(ellipse at 80% 80%, oklch(0.25 0.18 22 / 0.3), transparent 60%);
    }
    .noise-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    }
    .snowflakes-container {
      pointer-events: none;
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }
    .snowflake {
      filter: blur(0.5px);
      pointer-events: none;
      background: radial-gradient(circle, #ff6266e6, #d4092400);
      border-radius: 9999px;
      animation: linear infinite snowfall;
      position: absolute;
      top: 0;
    }
    @keyframes snowfall {
      0% {
        opacity: 0;
        transform: translateY(-10vh) translate(0);
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 0.8;
      }
      to {
        transform: translateY(110vh) translate(var(--drift, 20px));
        opacity: 0;
      }
    }
    @keyframes shimmer {
      0% {
        background-position: -200%;
      }
      to {
        background-position: 200%;
      }
    }
    .shimmer-text {
      -webkit-text-fill-color: transparent;
      background:
        linear-gradient(
          90deg,
          #fa002a,
          #ff303c,
          #ff474c 12.5%,
          #ff7a75 25%,
          #ffb7b3,
          #ff7a75 75%,
          #ff474c 87.5%,
          #ff303c,
          #fa002a
        ) 0 0 / 200%;
      background-clip: text;
      -webkit-background-clip: text;
      animation: 3s linear infinite shimmer;
    }
    .promo-link-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1),
        filter 0.2s;
      outline: none;
    }
    .promo-link-button:hover {
      transform: scale(1.02);
    }
    .promo-bar-inner {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem 2rem;
      border-radius: 9999px;
      padding: 0.9rem 2.2rem;
      backdrop-filter: blur(28px);
      background:
        linear-gradient(
          90deg,
          oklch(0.18 0.04 25 / 0.98),
          oklch(1 0 0 / 0.08),
          oklch(0.18 0.04 25 / 0.98)
        );
      box-shadow:
        0 0 0 1px var(--border-glow),
        0 0 18px oklch(0.62 0.26 25 / 0.25),
        0 0 55px oklch(0.62 0.26 25 / 0.2);
    }
    .glow-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background:
        radial-gradient(
          circle,
          oklch(0.62 0.26 25 / 0.5),
          transparent 70%
        );
      opacity: 0.6;
    }
    .promo-text-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--foreground);
    }
    .discount-text {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      background:
        linear-gradient(
          135deg,
          #ffb7b3,
          #ff7a75,
          #ff474c
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .separator {
      width: 1px;
      height: 24px;
      background-color:
        oklch(0.62 0.26 25 / 0.5);
    }
    .badge-limited {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--muted-foreground);
    }
    .action-hint {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background:
        oklch(0.62 0.26 25 / 0.22);
      padding: 0.55rem 1.3rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ember-glow);
    }
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 3rem 1rem 2rem;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 1.5rem;
      object-fit: contain;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    /* TOP RIGHT GOOGLE LOGIN POSITION */
    #google-login-wrapper {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      margin-top: 0;
    }

    /* ADMIN PANEL STYLES */
    #admin-panel {
      width: 100%;
      max-width: 960px;
      margin: 1rem auto 2rem;
      padding: 1.5rem;
      background: rgba(250, 0, 42, 0.12);
      border: 1px solid oklch(0.62 0.26 25 / 0.5);
      border-radius: 16px;
      display: none;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #ff7a75;
    }
    .form-input {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
    }
    #qc-drop-zone {
      border: 2px dashed #ff474c;
      padding: 2rem;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #qc-drop-zone.dragover {
      background: rgba(255, 71, 76, 0.15);
      border-color: #ff7a75;
    }
    #qc-preview {
      max-width: 100%;
      max-height: 300px;
      margin-top: 1rem;
      border-radius: 8px;
      display: none;
    }
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1f2e;
      backdrop-filter: blur(20px);
      padding: 12px 28px;
      border-radius: 60px;
      border-left: 6px solid #ff474c;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      font-size: 0.9rem;
    }
  </style>
</head>

  <!-- GOOGLE SCRIPT -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      // Supabase Configuration
      const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_6_2ZEDiDiWI6ShtNGz8DsQ_zpR5A6sF";
      const supabase = window.Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let currentUser = null;

      function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.backgroundColor = isError ? '#3b141c' : '#1a3324';
        toast.style.borderLeftColor = isError ? '#ff474c' : '#6bff9b';
        toast.style.opacity = '1';
        setTimeout(() => {
          toast.style.opacity = '0';
        }, 3000);
      }

      // REMOVE LOVABLE STUFF
      const removeLovableElements = () => {
        const badge = document.getElementById('lovable-badge');
        if (badge) badge.remove();
        const allBadges = document.querySelectorAll('[id*="lovable-badge"], .lovable-badge');
        allBadges.forEach(el => el.remove());
      };
      removeLovableElements();

      // MAIN BUTTON
      const mainButton = document.getElementById('exclusive-offer-button');
      if (mainButton) {
        mainButton.setAttribute('href', 'https://www.usfans.com/register?ref=2TQXNA');
      }

      // GOOGLE LOGIN HANDLER
      window.handleCredentialResponse = function(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = {
          id: payload.sub,
          name: payload.name,
          email: payload.email,
          picture: payload.picture
        };
        console.log("Logged in:", currentUser);
        localStorage.setItem("usfans_user", JSON.stringify(currentUser));
        showUser(currentUser);
      }

      function showUser(user) {
        const loginContainer = document.getElementById("google-login-wrapper");
        loginContainer.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); padding:12px 18px; border-radius:999px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08);">
            <img src="${user.picture}" style="width:42px; height:42px; border-radius:50%; border:2px solid #ff474c;">
            <div style="display:flex; flex-direction:column;">
              <span style="font-weight:700; color:white; font-size:14px;">${user.name}</span>
              <span style="font-size:12px; opacity:0.7; color:white;">${user.email}</span>
            </div>
            <button id="logout-from-google" style="background:rgba(255,71,76,0.2); border:1px solid #ff474c; color:#ffb7b3; padding:4px 12px; border-radius:40px; cursor:pointer; font-size:12px;">Sign Out</button>
          </div>
        `;
        
        // Show admin panel for ANY logged in user (not just XyLo BOT)
        document.getElementById('admin-panel').style.display = 'block';
        setupDragDrop();
        
        // Setup logout button
        const logoutBtn = document.getElementById('logout-from-google');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('usfans_user');
            window.location.reload();
          });
        }
      }

      function setupDragDrop() {
        const dropZone = document.getElementById('qc-drop-zone');
        const preview = document.getElementById('qc-preview');
        
        dropZone.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
              const reader = new FileReader();
              reader.onload = (ev) => { 
                preview.src = ev.target.result; 
                preview.style.display = 'block'; 
              };
              reader.readAsDataURL(file);
            }
          };
          input.click();
        });
        
        dropZone.addEventListener('dragover', (e) => { 
          e.preventDefault(); 
          dropZone.classList.add('dragover'); 
        });
        dropZone.addEventListener('dragleave', () => { 
          dropZone.classList.remove('dragover'); 
        });
        dropZone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
          const file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (ev) => { 
              preview.src = ev.target.result; 
              preview.style.display = 'block'; 
            };
            reader.readAsDataURL(file);
          }
        });
      }

      window.submitListing = async function() {
        if (!currentUser) {
          showToast("Please sign in with Google first", true);
          return;
        }

        let link = document.getElementById('product-link').value.trim();
        const name = document.getElementById('product-name').value.trim();
        
        if (!link || !name) {
          showToast("Please fill both Product Link and Name", true);
          return;
        }
        
        // Add ref parameter
        if (link && !link.includes('ref=2TQXNA')) {
          link += (link.includes('?') ? '&' : '?') + 'ref=2TQXNA';
        }
        
        const submitBtn = document.querySelector('#admin-panel button');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = "⏳ ADDING...";
        submitBtn.disabled = true;
        
        try {
          const { error } = await supabase
            .from('listings')
            .insert([{ 
              link: link, 
              name: name, 
              user_id: currentUser.id,
              user_email: currentUser.email,
              created_at: new Date().toISOString()
            }]);
          
          if (error) throw error;
          
          showToast(`✅ "${name}" added to your spreadsheet!`);
          console.log("New Listing Added:", { link: link, name: name });
          
          // Clear form
          document.getElementById('product-link').value = '';
          document.getElementById('product-name').value = '';
          document.getElementById('qc-preview').style.display = 'none';
          document.getElementById('qc-preview').src = '';
          
        } catch (error) {
          console.error("Supabase error:", error);
          showToast(`❌ Error: ${error.message}`, true);
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      };

      // Restore login session
      function restoreSession() {
        const savedUser = localStorage.getItem("usfans_user");
        if (savedUser) {
          try {
            currentUser = JSON.parse(savedUser);
            showUser(currentUser);
          } catch(e) {}
        }
      }

      window.addEventListener("load", () => {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.initialize({
            client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
            callback: window.handleCredentialResponse
          });
          google.accounts.id.renderButton(
            document.getElementById("google-login-button"),
            {
              theme: "filled_black",
              size: "large",
              shape: "pill",
              width: 260
            }
          );
          google.accounts.id.prompt();
        }

        // RESTORE LOGIN SESSION
        restoreSession();
      });
    })();
  </script>
</body>
</html>
