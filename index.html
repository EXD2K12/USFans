<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — Limited Time</title>
  <meta name="description" content="Grab 40% off shipping. Limited time offer.">
  <meta name="author" content="USFans">
  <link rel="preload" as="image" href="images/usfans-wzr06cld.webp">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: oklch(13% 0.02 25);
      --foreground: oklch(97% 0.01 20);
      --ember: oklch(62% 0.26 25);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .promo-link-button {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; max-width: 960px; margin: 0 auto; text-decoration: none; cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .promo-link-button:hover { transform: scale(1.02); }
    .promo-bar-inner {
      position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 1.2rem 2rem; border-radius: 9999px; padding: 0.9rem 2.2rem; backdrop-filter: blur(28px);
      background: linear-gradient(90deg, oklch(0.18 0.04 25 / 0.98), oklch(1 0 0 / 0.08), oklch(0.18 0.04 25 / 0.98));
      box-shadow: 0 0 0 1px oklch(0.62 0.26 25 / 0.4), 0 0 18px oklch(0.62 0.26 25 / 0.25);
    }
    .glow-overlay {
      pointer-events: none; position: absolute; inset: 0; border-radius: 9999px;
      background: radial-gradient(circle, oklch(0.62 0.26 25 / 0.5), transparent 70%); opacity: 0.6;
    }
    .discount-text {
      font-family: var(--font-display); font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, #ffb7b3, #ff7a75, #ff474c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #google-login-wrapper { position: absolute; top: 1.5rem; right: 1.5rem; z-index: 100; }
    #admin-panel {
      width: 100%; max-width: 960px; margin: 1.2rem auto 2rem; padding: 1.8rem;
      background: rgba(250, 0, 42, 0.15); border: 1px solid #ff474c;
      border-radius: 16px; display: none;
    }
    .form-input { width:100%; padding:12px; margin:8px 0; background:rgba(255,255,255,0.08); border:1px solid #ff474c; border-radius:8px; color:white; }
  </style>
</head>
<body>
  <main class="relative min-h-screen overflow-hidden">
    <div class="bg-radial-glow"></div>
    <div class="noise-overlay"></div>
    <div class="snowflakes-container" aria-hidden="true">
      <!-- Snowflakes -->
      <span class="snowflake" style="left:0.62%;width:1.9px;height:1.9px;animation-duration:10.3s;animation-delay:-2.4s;opacity:0.62;--drift:32px"></span>
      <!-- More snowflakes can be added if needed -->
    </div>

    <div id="google-login-wrapper"></div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel">
      <h2 style="color:#ff474c;text-align:center;margin-bottom:20px;">XyLo BOT - Add New Listing</h2>
      <input type="text" id="product-link" class="form-input" placeholder="https://www.usfans.com/product/...">
      <input type="text" id="product-name" class="form-input" placeholder="Product Name">
      <div id="qc-drop-zone" style="border:2px dashed #ff474c;padding:25px;margin:15px 0;text-align:center;cursor:pointer;border-radius:12px;">Drop QC Image Here</div>
      <img id="qc-preview" style="max-width:100%;margin:10px 0;display:none;">
      <button onclick="submitListing()" style="width:100%;padding:16px;background:#ff474c;color:white;border:none;border-radius:999px;font-weight:700;cursor:pointer;">ADD TO SPREADSHEET</button>
    </div>

    <div class="logo-section" style="text-align:center;padding-top:100px;">
      <a href="https://www.usfans.com/register?ref=2TQXNA" id="exclusive-offer-button" class="promo-link-button" target="_blank" rel="noopener noreferrer">
        <div class="promo-bar-inner">
          <div class="glow-overlay"></div>
          <div class="promo-text-group">
            <span>Grab your</span>
            <span class="discount-text shimmer-text">40% OFF</span>
            <span>shipping</span>
            <div class="separator"></div>
            <span class="badge-limited">Limited time</span>
          </div>
          <div class="action-hint"><span>Register now →</span></div>
        </div>
      </a>

      <a href="SpreadSheet.html" class="promo-link-button" style="margin-top:1rem;" target="_blank" rel="noopener noreferrer">
        <div class="promo-bar-inner">
          <div class="glow-overlay"></div>
          <div class="promo-text-group">
            <span>Check out our</span>
            <span class="discount-text shimmer-text">SPREADSHEET</span>
          </div>
          <div class="action-hint"><span>View Now →</span></div>
        </div>
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6_2ZEDiDiWI6ShtNGz8DsQ_zpR5A6sF";

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function handleCredentialResponse(response) {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      const user = { name: payload.name, email: payload.email, picture: payload.picture };
      localStorage.setItem("google_user", JSON.stringify(user));
      showUser(user);
    }

    function showUser(user) {
      const wrapper = document.getElementById("google-login-wrapper");
      wrapper.innerHTML = `<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.06);padding:12px 18px;border-radius:999px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);"><img src="${user.picture}" style="width:42px;height:42px;border-radius:50%;"><div style="display:flex;flex-direction:column;"><span style="font-weight:700;color:white;font-size:14px;">${user.name}</span><span style="font-size:12px;opacity:0.7;color:white;">${user.email}</span></div></div>`;

      if (user.name === "XyLo BOT" || (user.picture && user.picture.toLowerCase().endsWith('.gif'))) {
        document.getElementById('admin-panel').style.display = 'block';
      }
    }

    window.submitListing = async function() {
      let link = document.getElementById('product-link').value.trim();
      const name = document.getElementById('product-name').value.trim();

      if (!link || !name) return alert("Please fill both fields");

      if (!link.includes('ref=2TQXNA')) {
        link += (link.includes('?') ? '&' : '?') + 'ref=2TQXNA';
      }

      const { error } = await supabase.from('listings').insert([{ link, name }]);

      if (error) {
        alert("Error saving: " + error.message);
      } else {
        console.log("✅ Listing added to Spreadsheet");
        console.log({ link: link, name: name });
        console.log("1. link: \"" + link + "\"");
        console.log("2. name: \"" + name + "\"");
        console.log("3. [[Prototype]]: Object");

        alert("✅ Listing successfully saved to Spreadsheet!");

        // Clear fields
        document.getElementById('product-link').value = '';
        document.getElementById('product-name').value = '';
      }
    };

    window.addEventListener("load", () => {
      google.accounts.id.initialize({
        client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(document.getElementById("google-login-button"), {
        theme: "filled_black", size: "large", shape: "pill", width: 260
      });
      google.accounts.id.prompt();

      const saved = localStorage.getItem("google_user");
      if (saved) showUser(JSON.parse(saved));
    });
  </script>
</body>
</html>
