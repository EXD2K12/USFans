        // ---------- Firebase config ----------
        const firebaseConfig = {
            apiKey: "AIzaSyBmA63s5871OyebBRMqnrgd8b-XtfAvVoI",
            authDomain: "luxdrip-b0489.firebaseapp.com",
            projectId: "luxdrip-b0489",
            storageBucket: "luxdrip-b0489.firebasestorage.app",
            messagingSenderId: "558686841368",
            appId: "1:558686841368:web:d70848971654ae0526f16d",
            measurementId: "G-XT2JNKT7J0"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Admin email (same as before)
        const ADMIN_EMAIL = "emanuelnadd@gmail.com";

        const addListingPanel = document.getElementById('add-listing-panel');
        const loginWrapper = document.getElementById('google-login-wrapper');

        // ---------- Helper: store user in Firestore ----------
        async function upsertUser(uid, email, name, picture) {
            try {
                await db.collection('users').doc(uid).set({
                    email: email.toLowerCase(),
                    name: name,
                    picture: picture,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (err) {
                console.error('Error saving user to Firestore:', err);
            }
        }

        // ---------- UI update after sign-in ----------
        function showUserUI(user) {
            // user is the Firebase User object
            const displayName = user.displayName || user.email;
            const photoURL = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayName);
            loginWrapper.innerHTML = `
            <div class="user-card">
              <img src="${photoURL}" alt="${displayName}">
              <span class="user-name">${displayName}</span>
              <button onclick="signOut()" class="sign-out-btn">Sign Out</button>
            </div>
          `;

            // Show admin panel if email matches
            if (user.email && user.email.toLowerCase() === ADMIN_EMAIL) {
                addListingPanel.style.display = 'block';
                setupDragDrop();
            } else {
                addListingPanel.style.display = 'none';
            }

            // Store minimal user data in localStorage for quick checks
            localStorage.setItem('wtcbuy_user', JSON.stringify({
                uid: user.uid,
                email: user.email,
                name: displayName,
                picture: photoURL
            }));
        }

        // ---------- Sign out ----------
        window.signOut = function() {
            auth.signOut().then(() => {
                localStorage.removeItem('wtcbuy_user');
                loginWrapper.innerHTML = '<div id="google-login-button"></div>';
                addListingPanel.style.display = 'none';
                // Re‑render the GSI button (so user can sign in again)
                renderGSIButton();
            }).catch(err => {
                console.error('Sign out error:', err);
            });
        };

        // ---------- GSI callback ----------
        async function handleCredentialResponse(response) {
            const id_token = response.credential;
            try {
                // Sign in to Firebase with the Google ID token
                const credential = firebase.auth.GoogleAuthProvider.credential(id_token);
                const result = await auth.signInWithCredential(credential);
                const user = result.user;
                // Save/update user info in Firestore
                await upsertUser(user.uid, user.email, user.displayName, user.photoURL);
                showUserUI(user);
            } catch (err) {
                console.error('Firebase sign-in failed:', err);
                alert('Login failed: ' + err.message);
            }
        }

        // ---------- Render GSI button ----------
        function renderGSIButton() {
            const container = document.getElementById('google-login-button');
            if (!container) return;
            // Clear any previous content
            container.innerHTML = '';
            google.accounts.id.renderButton(
                container, { theme: "filled_black", size: "large", shape: "pill", width: 260 }
            );
        }

        // ---------- Auth state listener (restore session on load) ----------
        auth.onAuthStateChanged(user => {
            if (user) {
                showUserUI(user);
            } else {
                // Not signed in: show the GSI button
                loginWrapper.innerHTML = '<div id="google-login-button"></div>';
                renderGSIButton();
                addListingPanel.style.display = 'none';
                localStorage.removeItem('wtcbuy_user');
            }
        });

        // ---------- Initialize GSI on load ----------
        window.addEventListener('load', () => {
            google.accounts.id.initialize({
                client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            // If no user is signed in, show the button; else the auth listener will handle UI
            if (!auth.currentUser) {
                renderGSIButton();
                google.accounts.id.prompt(); // one‑tap prompt
            }
        });

        // ---------- Drag & drop for QC images (unchanged, but now uses Firebase Storage) ----------
        function setupDragDrop() {
            const dropZone = document.getElementById('qc-drop-zone');
            const previewContainer = document.getElementById('qc-preview-container');
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true;
            let selectedFiles = [];

            function updatePreview() {
                previewContainer.innerHTML = '';
                selectedFiles.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        previewContainer.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                });
                previewContainer.style.display = selectedFiles.length ? 'flex' : 'none';
            }

            dropZone.addEventListener('click', () => input.click());
            input.addEventListener('change', () => { selectedFiles = Array.from(input.files);
                updatePreview(); });
            dropZone.addEventListener('dragover', (e) => { e.preventDefault();
                dropZone.classList.add('dragover'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                selectedFiles = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                updatePreview();
            });
            window._qcFiles = () => selectedFiles;
        }

        // ---------- Submit listing (Firestore + Storage) ----------
        window.submitListing = async function() {
            const user = auth.currentUser;
            if (!user) {
                alert('You must be signed in to add a listing.');
                return;
            }
            if (user.email.toLowerCase() !== ADMIN_EMAIL) {
                alert('Only the admin can add listings.');
                return;
            }

            const link = document.getElementById('product-link').value.trim();
            const name = document.getElementById('product-name').value.trim();
            const files = window._qcFiles ? window._qcFiles() : [];

            if (!link || !name) {
                alert('Product link and name are required');
                return;
            }

            if (files.length === 0) {
                alert('No images selected. The listing will be added without QC pictures.');
            }

            // Append ref if not present
            let finalLink = link;
            if (!finalLink.includes('ref=2TQXNA')) {
                finalLink += (finalLink.includes('?') ? '&' : '?') + 'ref=2TQXNA';
            }

            const qcImageUrls = [];
            // Upload each image to Firebase Storage
            for (const file of files) {
                try {
                    const fileName = `${user.uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                    const storageRef = storage.ref('qc-images/' + fileName);
                    const snapshot = await storageRef.put(file);
                    const downloadURL = await snapshot.ref.getDownloadURL();
                    qcImageUrls.push(downloadURL);
                } catch (err) {
                    console.error('Upload error:', err);
                    alert('Image upload failed: ' + err.message);
                    // Continue with other images if any
                }
            }

            // Save listing to Firestore
            try {
                await db.collection('listings').add({
                    userId: user.uid,
                    name: name,
                    link: finalLink,
                    qc_image_url: qcImageUrls,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Listing added successfully!' + (qcImageUrls.length ? '' : ' (no images uploaded)'));
                // Clear form
                document.getElementById('product-link').value = '';
                document.getElementById('product-name').value = '';
                document.getElementById('qc-preview-container').innerHTML = '';
                const qcFilesFn = window._qcFiles;
                if (qcFilesFn) { const arr = qcFilesFn();
                    arr.length = 0; }
            } catch (err) {
                console.error('Firestore insert error:', err);
                alert('Failed to add listing: ' + err.message);
            }
        };

        // Remove any lingering Supabase references (the old script is replaced)
        console.log('🔥 Firebase integration ready – WTCBuy');
    </script>
</body>
