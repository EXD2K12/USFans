<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40% Off Shipping — Limited Time</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* KEEPING YOUR UI EXACT (unchanged except minor fixes) */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f0f10;color:#fff;font-family:Inter,sans-serif;}
.logo-section{display:flex;flex-direction:column;align-items:center;gap:2rem;padding:6rem 1rem;}
.logo-img{width:100px;height:100px;border-radius:20px;}
.promo-link-button{display:flex;justify-content:center;width:100%;max-width:900px;text-decoration:none;}
.promo-bar-inner{width:100%;display:flex;justify-content:center;gap:1rem;padding:1rem 2rem;border-radius:999px;background:rgba(255,255,255,0.06);}
.discount-text{font-family:'Cormorant Garamond';font-size:1.6rem;color:#ff474c;}
.action-hint{background:rgba(255,71,76,0.2);padding:0.6rem 1.2rem;border-radius:999px;}
#admin-panel{display:none;max-width:900px;margin:20px auto;padding:20px;border:1px solid #ff474c;border-radius:12px;}
.form-input{width:100%;padding:10px;margin-top:5px;border-radius:8px;background:#111;color:#fff;}
#qc-preview{max-width:100%;display:none;margin-top:10px;}
button{cursor:pointer;}
</style>
</head>

<body>

<div class="logo-section">

<img src="images/usfans-wzr06cld.webp" class="logo-img">

<a class="promo-link-button" href="https://www.usfans.com/register?ref=2TQXNA">
<div class="promo-bar-inner">
<span>40% OFF SHIPPING</span>
<span class="action-hint">Register</span>
</div>
</a>

<a class="promo-link-button" href="SpreadSheet.html">
<div class="promo-bar-inner">
<span>Spreadsheet</span>
<span class="action-hint">View</span>
</div>
</a>

</div>

<!-- ADMIN -->
<div id="admin-panel">

<h2>Add Listing</h2>

<input id="product-link" class="form-input" placeholder="Product link">
<input id="product-name" class="form-input" placeholder="Product name">

<div id="qc-drop">Click to upload image</div>
<img id="qc-preview">

<button onclick="submitListing()" style="margin-top:10px;padding:10px;background:#ff474c;color:#fff;border:none;border-radius:999px;">
ADD
</button>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
const SUPABASE_URL="https://fzfkroyskrvxkdtfseyl.supabase.co";
const SUPABASE_KEY="YOUR_KEY_HERE";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_EMAILS=[
  "YOUR_EMAIL@gmail.com"
];

let currentUser=null;
let uploadedImageUrl=null;

/* TOAST */
function toast(msg){
  document.getElementById("toast").innerText=msg;
}

/* LOGIN */
function handleCredentialResponse(res){
  const p=JSON.parse(atob(res.credential.split(".")[1]));

  currentUser={
    id:p.sub,
    email:p.email,
    name:p.name
  };

  localStorage.setItem("user",JSON.stringify(currentUser));

  if(ADMIN_EMAILS.includes(currentUser.email)){
    document.getElementById("admin-panel").style.display="block";
  }

  toast("Logged in");
}

/* IMAGE UPLOAD FIX */
document.getElementById("qc-drop").onclick=async()=>{

  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";

  input.onchange=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;

    const fileName=`${Date.now()}-${file.name}`;

    const {data,error}=await supabaseClient.storage
      .from("qc-images")
      .upload(fileName,file);

    if(error){
      alert(error.message);
      return;
    }

    const {data:publicUrl}=supabaseClient.storage
      .from("qc-images")
      .getPublicUrl(fileName);

    uploadedImageUrl=publicUrl.publicUrl;

    document.getElementById("qc-preview").src=uploadedImageUrl;
    document.getElementById("qc-preview").style.display="block";
  };

  input.click();
};

/* SUBMIT */
async function submitListing(){

  if(!currentUser) return toast("login first");

  const link=document.getElementById("product-link").value;
  const name=document.getElementById("product-name").value;

  if(!link||!name) return toast("fill all");

  const {error}=await supabaseClient.from("listings").insert([{
    link,
    name,
    image:uploadedImageUrl,
    user_id:currentUser.id,
    user_email:currentUser.email
  }]);

  if(error) return toast(error.message);

  toast("added");
}
</script>

</body>
</html>
