<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — Limited Time</title>
  <meta name="description" content="Grab 40% off shipping. Limited time offer.">
  <meta name="author" content="USFans">
  <link rel="preload" as="image" href="images/usfans-wzr06cld.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: oklch(13% 0.02 25);
      --foreground: oklch(97% 0.01 20);
      --muted-foreground: oklch(70% 0.03 25);
      --ember: oklch(62% 0.26 25);
      --ember-glow: oklch(70% 0.28 22);
      --border-glow: oklch(62% 0.26 25 / 0.4);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .relative {
      position: relative;
    }
    .min-h-screen {
      min-height: 100vh;
    }
    .overflow-hidden {
      overflow: hidden;
    }
    .bg-radial-glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, oklch(0.3 0.15 25 / 0.35), transparent 55%),
        radial-gradient(ellipse at 80% 80%, oklch(0.25 0.18 22 / 0.3), transparent 60%);
    }
    .noise-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    }
    .snowflakes-container {
      pointer-events: none;
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }
    .snowflake {
      filter: blur(0.5px);
      pointer-events: none;
      background: radial-gradient(circle, #ff6266e6, #d4092400);
      border-radius: 9999px;
      animation: linear infinite snowfall;
      position: absolute;
      top: 0;
    }
    @keyframes snowfall {
      0% {
        opacity: 0;
        transform: translateY(-10vh) translate(0);
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 0.8;
      }
      to {
        transform: translateY(110vh) translate(var(--drift, 20px));
        opacity: 0;
      }
    }
    @keyframes shimmer {
      0% {
        background-position: -200%;
      }
      to {
        background-position: 200%;
      }
    }
    .shimmer-text {
      -webkit-text-fill-color: transparent;
      background:
        linear-gradient(
          90deg,
          #fa002a,
          #ff303c,
          #ff474c 12.5%,
          #ff7a75 25%,
          #ffb7b3,
          #ff7a75 75%,
          #ff474c 87.5%,
          #ff303c,
          #fa002a
        ) 0 0 / 200%;
      background-clip: text;
      -webkit-background-clip: text;
      animation: 3s linear infinite shimmer;
    }
    .promo-link-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1),
        filter 0.2s;
      outline: none;
    }
    .promo-link-button:hover {
      transform: scale(1.02);
    }
    .promo-bar-inner {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem 2rem;
      border-radius: 9999px;
      padding: 0.9rem 2.2rem;
      backdrop-filter: blur(28px);
      background:
        linear-gradient(
          90deg,
          oklch(0.18 0.04 25 / 0.98),
          oklch(1 0 0 / 0.08),
          oklch(0.18 0.04 25 / 0.98)
        );
      box-shadow:
        0 0 0 1px var(--border-glow),
        0 0 18px oklch(0.62 0.26 25 / 0.25),
        0 0 55px oklch(0.62 0.26 25 / 0.2);
    }
    .glow-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background:
        radial-gradient(
          circle,
          oklch(0.62 0.26 25 / 0.5),
          transparent 70%
        );
      opacity: 0.6;
    }
    .promo-text-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--foreground);
    }
    .discount-text {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      background:
        linear-gradient(
          135deg,
          #ffb7b3,
          #ff7a75,
          #ff474c
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .separator {
      width: 1px;
      height: 24px;
      background-color:
        oklch(0.62 0.26 25 / 0.5);
    }
    .badge-limited {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--muted-foreground);
    }
    .action-hint {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background:
        oklch(0.62 0.26 25 / 0.22);
      padding: 0.55rem 1.3rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ember-glow);
    }
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 3rem 1rem 2rem;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 1.5rem;
      object-fit: contain;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    #google-login-wrapper {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
    }
    /* ADD LISTING FORM (glassmorphism) */
    .add-listing-panel {
      max-width: 960px;
      margin: 1rem auto 2rem;
      padding: 1.8rem;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid oklch(0.62 0.26 25 / 0.5);
      border-radius: 2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    .add-listing-panel h3 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      background: linear-gradient(135deg, #ffb7b3, #ff474c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #ffb7b3;
      letter-spacing: 0.3px;
    }
    .form-input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1.5rem;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #ff474c;
      background: rgba(255, 71, 76, 0.1);
    }
    .submit-listing-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(95deg, #ff474c, #ff7a75);
      border: none;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }
    .submit-listing-btn:hover {
      transform: scale(1.01);
      filter: brightness(1.05);
    }
    .toast-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1c1e;
      border-left: 5px solid #ff474c;
      padding: 0.8rem 1.6rem;
      border-radius: 40px;
      font-weight: 500;
      color: #fff;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
    }
    .hidden {
      display: none;
    }
    .user-welcome {
      margin-top: 1rem;
      text-align: center;
      color: #ffb7b3;
      font-size: 0.85rem;
    }
    .spreadsheet-hint {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
    }
    .spreadsheet-hint a {
      color: #ff7a75;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="relative min-h-screen overflow-hidden">
    <div class="bg-radial-glow"></div>
    <div class="noise-overlay"></div>
    <div class="snowflakes-container" aria-hidden="true">
      <!-- snowflakes same as original (shortened for brevity but kept functional) -->
      <span class="snowflake" style="left:0.62%;width:1.9px;height:1.9px;animation-duration:10.3s;animation-delay:-2.4s;opacity:0.62;--drift:32px"></span>
      <span class="snowflake" style="left:36.9%;width:2.15px;height:2.15px;animation-duration:8.38s;animation-delay:-0.38s;opacity:0.6;--drift:-17px"></span>
      <span class="snowflake" style="left:33.36%;width:2.96px;height:2.96px;animation-duration:8.51s;animation-delay:-3.7s;opacity:0.45;--drift:10px"></span>
      <span class="snowflake" style="left:12.4%;width:1.6px;height:1.6px;animation-duration:12.1s;animation-delay:-1.2s;opacity:0.55;--drift:25px"></span>
      <span class="snowflake" style="left:68.7%;width:2.4px;height:2.4px;animation-duration:7.8s;animation-delay:-4.5s;opacity:0.7;--drift:-22px"></span>
      <span class="snowflake" style="left:5.1%;width:1.8px;height:1.8px;animation-duration:9.6s;animation-delay:-0.9s;opacity:0.48;--drift:18px"></span>
      <span class="snowflake" style="left:84.3%;width:3.1px;height:3.1px;animation-duration:11.4s;animation-delay:-5.1s;opacity:0.52;--drift:35px"></span>
      <span class="snowflake" style="left:22.8%;width:1.4px;height:1.4px;animation-duration:6.9s;animation-delay:-2.8s;opacity:0.65;--drift:-12px"></span>
      <span class="snowflake" style="left:47.2%;width:2.7px;height:2.7px;animation-duration:10.7s;animation-delay:-1.6s;opacity:0.58;--drift:28px"></span>
      <span class="snowflake" style="left:91.5%;width:2.1px;height:2.1px;animation-duration:8.2s;animation-delay:-3.9s;opacity:0.42;--drift:-30px"></span>
    </div>
    <h1 class="sr-only">40% Off Shipping — Limited Time</h1>

    <!-- GOOGLE LOGIN TOP RIGHT -->
    <div id="google-login-wrapper">
      <div id="google-login-button"></div>
    </div>

    <!-- ADD LISTING FORM (visible only when logged in) -->
    <div id="add-listing-panel" class="add-listing-panel hidden">
      <h3>✨ Add New Product Listing</h3>
      <div class="form-group">
        <label>📦 Product Name</label>
        <input type="text" id="product-name-input" class="form-input" placeholder="e.g., Winter Hoodie Limited" autocomplete="off">
      </div>
      <div class="form-group">
        <label>🔗 Product Link (USFans)</label>
        <input type="url" id="product-link-input" class="form-input" placeholder="https://www.usfans.com/product/...">
      </div>
      <button id="submit-listing-btn" class="submit-listing-btn">➕ Add to Spreadsheet →</button>
      <div class="spreadsheet-hint">
        📋 All listings appear instantly in <a href="spreadsheet.html" target="_blank">My Spreadsheet</a>
      </div>
    </div>

    <div class="logo-section">
      <img src="images/usfans-wzr06cld.webp" alt="USFans" class="logo-img">
      <a href="https://www.usfans.com/register?ref=2TQXNA" id="exclusive-offer-button" class="promo-link-button" target="_blank" rel="noopener noreferrer">
        <div class="promo-bar-inner">
          <div class="glow-overlay"></div>
          <div class="promo-text-group">
            <span>Grab your</span>
            <span class="discount-text shimmer-text">40% OFF</span>
            <span>shipping</span>
            <div class="separator"></div>
            <span class="badge-limited">Limited time</span>
          </div>
          <div class="action-hint"><span>Register now →</span></div>
        </div>
      </a>
      <a href="spreadsheet.html" id="spreadsheet-button" class="promo-link-button" style="margin-top: 1rem;" target="_blank">
        <div class="promo-bar-inner">
          <div class="glow-overlay"></div>
          <div class="promo-text-group">
            <span>Check out our</span>
            <span class="discount-text shimmer-text">SPREADSHEET</span>
          </div>
          <div class="action-hint"><span>View Now →</span></div>
        </div>
      </a>
    </div>
    <div style="height: 2rem;"></div>
  </main>
  <div id="toast-root" class="toast-message"></div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function() {
      // ----------------------------- SUPABASE CONFIGURATION ---------------------------------
      // IMPORTANT: Replace the anon key with your actual Supabase anon key
      const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
      const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";   // <-- Replace with real key
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      // DOM elements
      const loginWrapper = document.getElementById('google-login-wrapper');
      const addListingPanel = document.getElementById('add-listing-panel');
      const productNameInput = document.getElementById('product-name-input');
      const productLinkInput = document.getElementById('product-link-input');
      const submitBtn = document.getElementById('submit-listing-btn');
      const toastEl = document.getElementById('toast-root');
      
      let currentUser = null;   // stores { sub, name, email, picture }
      
      function showToast(message, isError = false) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.style.borderLeftColor = isError ? '#ff474c' : '#4dff88';
        toastEl.style.opacity = '1';
        setTimeout(() => {
          toastEl.style.opacity = '0';
        }, 3200);
      }
      
      // Helper: Ensure product link includes ref parameter (ref=2TQXNA)
      function ensureRefParam(url) {
        if (!url) return '';
        try {
          const urlObj = new URL(url);
          if (!urlObj.searchParams.has('ref')) {
            urlObj.searchParams.set('ref', '2TQXNA');
          }
          return urlObj.toString();
        } catch(e) {
          // if invalid URL just append
          if (url.includes('?')) return url + '&ref=2TQXNA';
          else return url + '?ref=2TQXNA';
        }
      }
      
      // Add listing to Supabase
      async function addListingToSupabase(productName, productLink) {
        if (!currentUser || !currentUser.sub) {
          showToast("You must be logged in to add listings", true);
          return false;
        }
        if (!productName.trim()) {
          showToast("Please enter a product name", true);
          return false;
        }
        if (!productLink.trim()) {
          showToast("Please enter a valid product link", true);
          return false;
        }
        
        const finalLink = ensureRefParam(productLink.trim());
        const newListing = {
          name: productName.trim(),
          link: finalLink,
          user_id: currentUser.sub,   // using Google unique sub as user identifier (email never shown)
          created_at: new Date().toISOString()
        };
        
        try {
          const { data, error } = await supabase
            .from('listings')
            .insert([newListing])
            .select();
          
          if (error) throw error;
          showToast(`✅ "${productName.trim()}" added to spreadsheet!`);
          // clear form fields
          productNameInput.value = '';
          productLinkInput.value = '';
          return true;
        } catch (err) {
          console.error("Supabase insert error:", err);
          showToast(`Error: ${err.message}`, true);
          return false;
        }
      }
      
      // Google login callback
      function handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        const user = {
          sub: payload.sub,
          name: payload.name,
          email: payload.email,
          picture: payload.picture
        };
        localStorage.setItem("google_user", JSON.stringify(user));
        currentUser = user;
        renderLoggedInUI(user);
        showToast(`Welcome, ${user.name}! You can now add listings.`);
      }
      
      // UI after login: show Add Listing panel, change google button to user profile
      function renderLoggedInUI(user) {
        const container = document.getElementById('google-login-wrapper');
        container.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); padding:8px 18px; border-radius:999px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.12);">
            <img src="${user.picture}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
            <div style="display:flex; flex-direction:column;">
              <span style="font-weight:700; font-size:13px; color:white;">${user.name}</span>
              <span style="font-size:10px; opacity:0.6;">${user.email}</span>
            </div>
          </div>
        `;
        addListingPanel.classList.remove('hidden');
      }
      
      // check existing session on load
      function restoreSession() {
        const savedUser = localStorage.getItem("google_user");
        if (savedUser) {
          try {
            currentUser = JSON.parse(savedUser);
            if (currentUser && currentUser.sub) {
              renderLoggedInUI(currentUser);
            } else {
              addListingPanel.classList.add('hidden');
            }
          } catch(e) { console.warn(e); addListingPanel.classList.add('hidden'); }
        } else {
          addListingPanel.classList.add('hidden');
        }
      }
      
      // submit event
      submitBtn.addEventListener('click', async () => {
        const name = productNameInput.value;
        let link = productLinkInput.value;
        if (!name || !link) {
          showToast("Both product name and link are required", true);
          return;
        }
        await addListingToSupabase(name, link);
      });
      
      // Initialize Google login
      window.addEventListener("load", () => {
        restoreSession();
        google.accounts.id.initialize({
          client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
          callback: handleCredentialResponse
        });
        google.accounts.id.renderButton(
          document.getElementById("google-login-button"),
          { theme: "filled_black", size: "large", shape: "pill", width: 260 }
        );
        google.accounts.id.prompt(); // one-tap
      });
      
      // remove any stray lovable badges
      const removeLovable = () => {
        const badge = document.getElementById('lovable-badge');
        if(badge) badge.remove();
        document.querySelectorAll('.lovable-badge, [id*="lovable"]').forEach(el => el.remove());
      };
      removeLovable();
    })();
  </script>
</body>
</html>
