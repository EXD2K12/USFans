<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40% Off Shipping — Limited Time</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#0b0b0d;
  --text:#fff;
  --red:#ff3b3f;
  --red2:#ff7a7a;
  --font1:'Inter',sans-serif;
  --font2:'Playfair Display',serif;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font1);
  overflow-x:hidden;
}

/* RED SNOW */
.snow{
  position:fixed;
  top:-10px;
  width:6px;
  height:6px;
  background:radial-gradient(circle,var(--red2),transparent);
  border-radius:50%;
  animation:fall linear infinite;
  opacity:.8;
}

@keyframes fall{
  to{
    transform:translateY(110vh);
  }
}

.logo-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2rem;
  padding:4rem 1rem;
}

.logo-img{
  width:100px;
  border-radius:20px;
}

.promo-link-button{
  display:flex;
  justify-content:center;
  text-decoration:none;
}

.promo-bar-inner{
  padding:1rem 2rem;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  display:flex;
  gap:1rem;
  align-items:center;
}

.discount-text{
  font-family:var(--font2);
  font-size:1.6rem;
  color:var(--red2);
}

.action-hint{
  background:rgba(255,59,63,0.2);
  padding:.5rem 1rem;
  border-radius:999px;
  color:var(--red2);
}

#admin-panel{
  display:none;
  max-width:900px;
  margin:2rem auto;
  padding:1.5rem;
  border:1px solid rgba(255,59,63,.4);
  border-radius:15px;
}

.form-input{
  width:100%;
  padding:.8rem;
  margin-top:.3rem;
  background:#111;
  border:1px solid #333;
  color:#fff;
  border-radius:8px;
}

#qc-drop-zone{
  padding:2rem;
  border:2px dashed var(--red);
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

#qc-preview{
  max-width:100%;
  margin-top:1rem;
  display:none;
}
</style>
</head>

<body>

<script>
/* RED SNOW GENERATOR */
for(let i=0;i<60;i++){
  const s=document.createElement("div");
  s.className="snow";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(3+Math.random()*6)+"s";
  s.style.opacity=Math.random();
  s.style.width=s.style.height=(2+Math.random()*4)+"px";
  document.body.appendChild(s);
}
</script>

<div id="google-login-wrapper"></div>

<div id="admin-panel">
<h2>Add Product</h2>

<input id="product-link" class="form-input" placeholder="link">
<input id="product-name" class="form-input" placeholder="name">

<div id="qc-drop-zone">Drop image</div>
<img id="qc-preview">

<button onclick="submitListing()">ADD</button>
</div>

<div class="logo-section">

<img class="logo-img" src="images/usfans-wzr06cld.webp">

<a class="promo-link-button" href="https://www.usfans.com/register?ref=2TQXNA">
<div class="promo-bar-inner">
<span>Grab</span>
<span class="discount-text">40% OFF</span>
<span>shipping</span>
<div class="action-hint">Register →</div>
</div>
</a>

<a class="promo-link-button" href="SpreadSheet.html">
<div class="promo-bar-inner">
<span>Open</span>
<span class="discount-text">Spreadsheet</span>
<div class="action-hint">View →</div>
</div>
</a>

</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://fzfkroyskrvxkdtfseyl.supabase.co",
  "YOUR_SUPABASE_KEY_HERE"
);

let currentUser=null;

function handleCredentialResponse(res){
  const p=JSON.parse(atob(res.credential.split(".")[1]));
  currentUser=p;
  localStorage.setItem("u",JSON.stringify(p));
  document.getElementById("admin-panel").style.display="block";
}

function submitListing(){
  if(!currentUser)return alert("login first");

  const link=document.getElementById("product-link").value;
  const name=document.getElementById("product-name").value;

  supabaseClient.from("listings").insert([{link,name}]);

  alert("saved");
}

window.onload=()=>{
  google.accounts.id.initialize({
    client_id:"215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
    callback:handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById("google-login-wrapper"),
    {theme:"filled_black",size:"large"}
  );

  const saved=localStorage.getItem("u");
  if(saved)currentUser=JSON.parse(saved);
};
</script>

</body>
</html>
