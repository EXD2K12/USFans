<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40% Off Shipping — Limited Time</title>
  <meta name="description" content="Grab 40% off shipping. Limited time offer.">
  <meta name="author" content="USFans">
  <link rel="preload" as="image" href="images/usfans-wzr06cld.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: oklch(13% 0.02 25);
      --foreground: oklch(97% 0.01 20);
      --muted-foreground: oklch(70% 0.03 25);
      --ember: oklch(62% 0.26 25);
      --ember-glow: oklch(70% 0.28 22);
      --border-glow: oklch(62% 0.26 25 / 0.4);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-radial-glow {
      pointer-events: none; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, oklch(0.3 0.15 25 / 0.35), transparent 55%),
                  radial-gradient(ellipse at 80% 80%, oklch(0.25 0.18 22 / 0.3), transparent 60%);
      z-index: 0;
    }
    .noise-overlay {
      pointer-events: none; position: fixed; inset: 0; opacity: 0.04; mix-blend-mode: overlay; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    }
    .snowflakes-container {
      pointer-events: none; position: fixed; inset: 0; overflow: hidden; z-index: 2;
    }
    .snowflake {
      filter: blur(0.5px); pointer-events: none;
      background: radial-gradient(circle, #ff6266e6, #d4092400);
      border-radius: 9999px; animation: linear infinite snowfall; position: absolute; top: 0;
    }
    @keyframes snowfall {
      0% { opacity: 0; transform: translateY(-10vh) translate(0); }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      to { transform: translateY(110vh) translate(var(--drift, 20px)); opacity: 0; }
    }
    .shimmer-text {
      -webkit-text-fill-color: transparent;
      background: linear-gradient(90deg, #fa002a, #ff303c, #ff474c 12.5%, #ff7a75 25%, #ffb7b3, #ff7a75 75%, #ff474c 87.5%, #ff303c, #fa002a) 0 0 / 200%;
      background-clip: text; -webkit-background-clip: text; animation: 3s linear infinite shimmer;
    }
    .promo-link-button {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; max-width: 960px; margin: 0 auto; text-decoration: none; cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), filter 0.2s;
    }
    .promo-link-button:hover { transform: scale(1.02); }
    .promo-bar-inner {
      position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 1.2rem 2rem; border-radius: 9999px; padding: 0.9rem 2.2rem; backdrop-filter: blur(28px);
      background: linear-gradient(90deg, oklch(0.18 0.04 25 / 0.98), oklch(1 0 0 / 0.08), oklch(0.18 0.04 25 / 0.98));
      box-shadow: 0 0 0 1px var(--border-glow), 0 0 18px oklch(0.62 0.26 25 / 0.25), 0 0 55px oklch(0.62 0.26 25 / 0.2);
    }
    .glow-overlay {
      pointer-events: none; position: absolute; inset: 0; border-radius: 9999px;
      background: radial-gradient(circle, oklch(0.62 0.26 25 / 0.5), transparent 70%); opacity: 0.6;
    }
    .promo-text-group {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 1rem;
      font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--foreground);
    }
    .discount-text {
      font-family: var(--font-display); font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, #ffb7b3, #ff7a75, #ff474c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .separator { width: 1px; height: 24px; background-color: oklch(0.62 0.26 25 / 0.5); }
    .badge-limited { font-size: 0.7rem; letter-spacing: 0.3em; color: var(--muted-foreground); }
    .action-hint {
      display: flex; align-items: center; gap: 0.6rem;
      background: oklch(0.62 0.26 25 / 0.22); padding: 0.55rem 1.3rem; border-radius: 40px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ember-glow);
    }
    .logo-section { display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 3rem 1rem 2rem; position: relative; z-index: 3; }
    .logo-img { width: 96px; height: 96px; border-radius: 1.5rem; object-fit: contain; }

    /* Google Login & User Profile - FIXED POSITION */
    .auth-area {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 0.4rem 1rem 0.4rem 0.8rem;
      border-radius: 60px;
      border: 1px solid var(--border-glow);
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #ff474c;
    }
    .user-name {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .logout-btn {
      background: rgba(255, 71, 76, 0.2);
      border: 1px solid #ff474c;
      color: #ffb7b3;
      padding: 0.3rem 0.7rem;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.2s;
    }
    .logout-btn:hover {
      background: rgba(255, 71, 76, 0.4);
    }

    /* Admin Panel */
    #admin-panel {
      width: 100%;
      max-width: 960px;
      margin: 1.2rem auto 2rem;
      padding: 1.8rem;
      background: rgba(250, 0, 42, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid oklch(0.62 0.26 25 / 0.6);
      border-radius: 32px;
      position: relative;
      z-index: 3;
      display: none;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #ff7a75; }
    .form-input {
      width: 100%; padding: 0.85rem 1rem; background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 71, 76, 0.5); border-radius: 20px; color: white;
      font-family: var(--font-sans); font-size: 0.95rem;
    }
    .form-input:focus { outline: none; border-color: #ff7a75; box-shadow: 0 0 0 2px rgba(255, 71, 76, 0.3); }
    #qc-drop-zone {
      border: 2px dashed #ff474c; padding: 1.8rem; text-align: center;
      border-radius: 24px; cursor: pointer; background: rgba(0,0,0,0.3);
      transition: all 0.2s;
    }
    #qc-drop-zone.dragover { background: rgba(255, 71, 76, 0.2); border-color: #ff7a75; }
    #qc-preview { max-width: 100%; max-height: 260px; margin-top: 1rem; border-radius: 20px; display: none; }
    .btn-submit {
      width:100%; padding: 1rem; background: linear-gradient(95deg, #ff474c, #e63e42);
      color: white; border: none; border-radius: 60px; font-weight: 800; cursor: pointer;
      font-size: 1rem; transition: 0.2s;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-submit:hover:not(:disabled) { transform: scale(0.98); }
    .toast-msg {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a1f2e; backdrop-filter: blur(20px); padding: 12px 28px;
      border-radius: 60px; border-left: 6px solid #ff474c; z-index: 999;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="bg-radial-glow"></div>
  <div class="noise-overlay"></div>
  <div class="snowflakes-container" aria-hidden="true">
    <span class="snowflake" style="left:0.62%;width:1.9px;height:1.9px;animation-duration:10.3s;--drift:32px"></span>
    <span class="snowflake" style="left:36.9%;width:2.15px;height:2.15px;animation-duration:8.38s;--drift:-17px"></span>
    <span class="snowflake" style="left:33.36%;width:2.96px;height:2.96px;animation-duration:8.51s;--drift:10px"></span>
    <span class="snowflake" style="left:72.1%;width:2.2px;height:2.2px;animation-duration:9.2s;--drift:-22px"></span>
    <span class="snowflake" style="left:88%;width:1.6px;height:1.6px;animation-duration:7.4s;--drift:18px"></span>
  </div>

  <!-- GOOGLE LOGIN AREA - TOP RIGHT CORNER -->
  <div class="auth-area">
    <div id="google-login-button"></div>
    <div id="user-profile" class="user-profile" style="display: none;">
      <img id="user-avatar" class="user-avatar" alt="avatar">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="logo-section">
    <img src="images/usfans-wzr06cld.webp" alt="USFans" class="logo-img">
    
    <!-- 40% OFF Promo Button -->
    <a href="https://www.usfans.com/register?ref=2TQXNA" class="promo-link-button" target="_blank" rel="noopener noreferrer">
      <div class="promo-bar-inner">
        <div class="glow-overlay"></div>
        <div class="promo-text-group">
          <span>Grab your</span>
          <span class="discount-text shimmer-text">40% OFF</span>
          <span>shipping</span>
          <div class="separator"></div>
          <span class="badge-limited">Limited time</span>
        </div>
        <div class="action-hint"><span>Register now →</span></div>
      </div>
    </a>

    <!-- CHECK OUT OUR SPREADSHEET BUTTON - LINKS TO SpreadSheet.html -->
    <a href="SpreadSheet.html" class="promo-link-button">
      <div class="promo-bar-inner">
        <div class="glow-overlay"></div>
        <div class="promo-text-group">
          <span>Check out our</span>
          <span class="discount-text shimmer-text">SPREADSHEET</span>
        </div>
        <div class="action-hint"><span>View All Listings →</span></div>
      </div>
    </a>
  </div>

  <!-- Admin Panel - Only shows when logged in -->
  <div id="admin-panel">
    <h2 style="color:#ff474c; text-align:center; margin-bottom:1.5rem; font-size:1.6rem; font-family: var(--font-display);">✨ Add New Product</h2>
    <div class="form-group">
      <label>🔗 Product Link</label>
      <input type="text" id="product-link" class="form-input" placeholder="https://www.usfans.com/product/...">
    </div>
    <div class="form-group">
      <label>🏷️ Product Name</label>
      <input type="text" id="product-name" class="form-input" placeholder="Enter product name">
    </div>
    <div class="form-group">
      <label>📸 Product Image (Drag & Drop - Preview Only)</label>
      <div id="qc-drop-zone">📂 Drop image here or click to upload</div>
      <img id="qc-preview" alt="Preview">
    </div>
    <button id="submitBtn" class="btn-submit">➕ ADD TO MY LISTINGS</button>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.75rem; color: var(--muted-foreground);">
      Your listings will appear in your personal spreadsheet
    </p>
  </div>

  <div id="toast" class="toast-msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6_2ZEDiDiWI6ShtNGz8DsQ_zpR5A6sF";
    const supabase = window.Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.backgroundColor = isError ? '#3b141c' : '#1a3324';
      toast.style.borderLeftColor = isError ? '#ff474c' : '#6bff9b';
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 3000);
    }

    // Google Sign-In callback
    window.handleCredentialResponse = function(response) {
      try {
        const decoded = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = {
          id: decoded.sub,
          email: decoded.email,
          name: decoded.name,
          picture: decoded.picture
        };
        
        // Save to localStorage for SpreadSheet.html to read
        localStorage.setItem('usfans_user', JSON.stringify(currentUser));
        
        // Update UI - hide google button, show user profile
        const googleBtnDiv = document.getElementById('google-login-button');
        if (googleBtnDiv) googleBtnDiv.style.display = 'none';
        
        document.getElementById('user-profile').style.display = 'flex';
        document.getElementById('user-avatar').src = currentUser.picture;
        document.getElementById('user-name').textContent = currentUser.name.split(' ')[0];
        document.getElementById('admin-panel').style.display = 'block';
        
        showToast(`✅ Welcome ${currentUser.name}! You can now add products.`);
      } catch (e) {
        console.error("Google auth error", e);
        showToast("Login failed", true);
      }
    };

    // Submit listing to Supabase
    async function submitListing() {
      if (!currentUser) {
        showToast("Please sign in with Google first", true);
        return;
      }

      let link = document.getElementById('product-link').value.trim();
      const name = document.getElementById('product-name').value.trim();

      if (!link || !name) {
        showToast("❌ Please fill both Product Link and Name", true);
        return;
      }

      // Add ref=2TQXNA parameter
      if (!link.includes('ref=2TQXNA')) {
        link += (link.includes('?') ? '&' : '?') + 'ref=2TQXNA';
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ SAVING...";

      try {
        const { error } = await supabase
          .from('listings')
          .insert([{ 
            link: link, 
            name: name, 
            user_id: currentUser.id,
            user_email: currentUser.email,
            created_at: new Date().toISOString()
          }]);

        if (error) throw error;

        showToast(`✅ "${name}" added to your spreadsheet!`);
        
        // Clear form
        document.getElementById('product-link').value = '';
        document.getElementById('product-name').value = '';
        const previewImg = document.getElementById('qc-preview');
        previewImg.style.display = 'none';
        previewImg.src = '';
        
      } catch (error) {
        console.error("Supabase error:", error);
        showToast(`❌ Error: ${error.message}`, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "➕ ADD TO MY LISTINGS";
      }
    }

    // Logout function
    function logout() {
      localStorage.removeItem('usfans_user');
      currentUser = null;
      const googleBtnDiv = document.getElementById('google-login-button');
      if (googleBtnDiv) googleBtnDiv.style.display = 'block';
      document.getElementById('user-profile').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'none';
      showToast("Signed out successfully");
    }

    // Check for existing session (if user already logged in from before)
    function checkExistingSession() {
      const saved = localStorage.getItem('usfans_user');
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          const googleBtnDiv = document.getElementById('google-login-button');
          if (googleBtnDiv) googleBtnDiv.style.display = 'none';
          document.getElementById('user-profile').style.display = 'flex';
          document.getElementById('user-avatar').src = currentUser.picture;
          document.getElementById('user-name').textContent = currentUser.name.split(' ')[0];
          document.getElementById('admin-panel').style.display = 'block';
          showToast(`Welcome back ${currentUser.name}!`);
        } catch(e) {
          console.error("Failed to parse saved user", e);
        }
      }
    }

    // Setup image drag & drop preview
    function setupImagePreview() {
      const dropZone = document.getElementById('qc-drop-zone');
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.style.display = 'none';
      document.body.appendChild(fileInput);
      const previewImg = document.getElementById('qc-preview');

      function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewImg.style.display = 'block';
          };
          reader.readAsDataURL(file);
        } else if (file) {
          showToast("Please drop an image file", true);
        }
      }

      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (fileInput.files && fileInput.files[0]) {
          handleFile(fileInput.files[0]);
        }
      });
      
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
        dropZone.addEventListener(ev, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });
      dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      });
    }

    // Initialize everything
    window.addEventListener('load', () => {
      // Remove any lovable badges
      document.querySelectorAll('#lovable-badge, [id*="lovable-badge"], .lovable-badge').forEach(el => el.remove());
      
      // Initialize Google Sign-In
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
          callback: window.handleCredentialResponse
        });
        
        const googleBtnElement = document.getElementById("google-login-button");
        if (googleBtnElement) {
          google.accounts.id.renderButton(googleBtnElement, {
            theme: "filled_black", 
            size: "large", 
            shape: "pill", 
            width: 260
          });
        }
        
        // Show one-tap prompt
        google.accounts.id.prompt();
      } else {
        console.warn("Google API not loaded yet, waiting...");
        // Retry after a short delay
        setTimeout(() => {
          if (window.google && google.accounts && google.accounts.id) {
            google.accounts.id.initialize({
              client_id: "215291464454-i5jmqnoalmhrsu89b13pa7gq2nksgkj3.apps.googleusercontent.com",
              callback: window.handleCredentialResponse
            });
            const googleBtnElement = document.getElementById("google-login-button");
            if (googleBtnElement) {
              google.accounts.id.renderButton(googleBtnElement, {
                theme: "filled_black", 
                size: "large", 
                shape: "pill", 
                width: 260
              });
            }
            google.accounts.id.prompt();
          }
        }, 500);
      }
      
      // Check if user is already logged in
      checkExistingSession();
      
      // Setup submit button
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.addEventListener('click', submitListing);
      }
      
      // Setup logout button
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', logout);
      }
      
      // Setup image preview
      setupImagePreview();
      
      console.log("Page loaded - Google login button should be visible at top right");
    });
  </script>
</body>
</html>
