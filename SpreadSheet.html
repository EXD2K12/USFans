<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listings Spreadsheet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0f0f10;
  color:white;
  font-family:Arial;
  padding:40px;
}

h1{margin-bottom:20px;}

table{
  width:100%;
  border-collapse:collapse;
  background:#18181b;
  border-radius:12px;
  overflow:hidden;
}

th,td{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  text-align:left;
}

th{background:#ff474c;}

tr:hover{background:rgba(255,255,255,0.03);}

a{color:#7ab7ff;text-decoration:none;}

.loading{opacity:0.7;}
</style>
</head>

<body>

<h1>USFans Listings</h1>

<div id="loading" class="loading">Loading listings...</div>

<table id="table" style="display:none;">
  <thead>
    <tr>
      <th>Name</th>
      <th>Link</th>
      <th>User</th>
      <th>Date</th>
    </tr>
  </thead>

  <tbody id="table-body"></tbody>
</table>

<script>
const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Zmtyb3lza3J2eGtkdGZzZXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMTczNTMsImV4cCI6MjA5NTU5MzM1M30.jzvCdD3Phi_jS3L0PnCcK6gyeq2D8ZZBVpVfvQ7leKc";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadListings(){

  const loading = document.getElementById("loading");
  const table = document.getElementById("table");
  const tbody = document.getElementById("table-body");

  loading.style.display = "block";

  const { data, error } = await supabaseClient
    .from("listings")
    .select("*")
    .order("created_at", { ascending:false });

  loading.style.display = "none";

  if(error){
    loading.innerHTML = "Error loading listings";
    console.error(error);
    return;
  }

  table.style.display = "table";

  tbody.innerHTML = "";

  (data || []).forEach(item => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${item.name || ""}</td>
      <td>
        <a href="${item.link}" target="_blank">
          Open Product
        </a>
      </td>
      <td>${item.user_email || "Unknown"}</td>
      <td>
        ${item.created_at ? new Date(item.created_at).toLocaleString() : ""}
      </td>
    `;

    tbody.appendChild(tr);
  });
}

loadListings();
</script>

</body>
</html>
