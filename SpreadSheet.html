<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USFans Spreadsheet — All Listings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4048219571639841" crossorigin="anonymous"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --background: #0f0f10;
      --foreground: #ffffff;
      --muted: #b3b3b3;
      --accent: #ff474c;
      --accent2: #ff7a75;
    }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-radial-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,71,76,0.18), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255,71,76,0.14), transparent 40%);
      z-index: 0;
    }
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem 1rem;
      position: relative;
      z-index: 2;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: contain;
    }
    .promo-link-button {
      width: 100%;
      max-width: 900px;
      text-decoration: none;
      transition: .25s;
    }
    .promo-link-button:hover {
      transform: scale(1.02);
    }
    .promo-bar-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
    }
    .promo-text-group {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }
    .discount-text {
      font-family: var(--font-display);
      font-size: 1.6rem;
      background: linear-gradient(90deg, #ffb7b3, #ff474c, #ff7a75);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .action-hint {
      background: rgba(255,71,76,0.15);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      color: #ffb7b3;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .spreadsheet-container {
      max-width: 1400px;
      margin: 0 auto 4rem;
      padding: 0 1rem;
      position: relative;
      z-index: 2;
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .table-title {
      font-family: var(--font-display);
      font-size: 2rem;
      background: linear-gradient(90deg, #ffb7b3, #ff474c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-badge {
      background: rgba(255,71,76,0.15);
      border: 1px solid rgba(255,71,76,0.3);
      padding: 0.6rem 1rem;
      border-radius: 999px;
    }
    .search-input {
      width: 100%;
      max-width: 320px;
      padding: 0.9rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: white;
      margin-bottom: 1.5rem;
    }
    .table-wrapper {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      overflow: hidden;
      overflow-x: auto;
      backdrop-filter: blur(20px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background: rgba(255,71,76,0.08);
    }
    th {
      padding: 1rem;
      text-align: left;
      color: #ffb7b3;
      cursor: pointer;
    }
    td {
      padding: 1rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    tr:hover {
      background: rgba(255,71,76,0.05);
    }
    .product-link {
      color: #ff7a75;
      text-decoration: none;
    }
    .product-link:hover {
      text-decoration: underline;
    }
    .delete-btn {
      background: rgba(255,71,76,0.15);
      border: 1px solid #ff474c;
      color: #ff474c;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }
    .delete-btn:hover {
      background: #ff474c;
      color: white;
    }
    .loading,
    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,71,76,0.2);
      border-top-color: #ff474c;
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      border-left: 4px solid #ff474c;
      padding: 0.8rem 1.3rem;
      border-radius: 999px;
      opacity: 0;
      transition: .3s;
      z-index: 9999;
    }
    .qc-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 4px;
      max-width: 120px;
    }
    .qc-images img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
    }
    .hide-col {
      display: none;
    }
  </style>
</head>
<body>
<div class="bg-radial-glow"></div>

<div class="logo-section">
  <img src="images/usfans-wzr06cld.webp" class="logo-img" alt="USFans">
  <a href="index.html" class="promo-link-button">
    <div class="promo-bar-inner">
      <div class="promo-text-group">
        <span>← Back To</span>
        <span class="discount-text">HOME</span>
      </div>
      <div class="action-hint">Return</div>
    </div>
  </a>
</div>

<div class="spreadsheet-container">
  <div class="table-header">
    <h2 class="table-title">📋 All Product Listings</h2>
    <div class="stats-badge" id="listing-count">Loading...</div>
  </div>
  <input type="text" id="search-input" class="search-input" placeholder="🔍 Search listings...">
  <div class="table-wrapper">
    <div id="loading-state" class="loading">
      <div class="spinner"></div>
      <p>Loading listings...</p>
    </div>
    <div id="table-content" style="display:none;">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('name')">Product ↕</th>
            <th>Link</th>
            <th>QC Images</th>
            <th onclick="sortTable('created_at')">Date ↕</th>
            <th id="actions-header">Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <p>📭 No listings found</p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://fzfkroyskrvxkdtfseyl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Zmtyb3lza3J2eGtkdGZzZXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMTczNTMsImV4cCI6MjA5NTU5MzM1M30.jzvCdD3Phi_jS3L0PnCcK6gyeq2D8ZZBVpVfvQ7leKc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ADMIN_EMAIL = "emanuelnadd@gmail.com";

  let currentUser = null;
  let isAdmin = false;
  let allListings = [];
  let currentSort = { column: 'created_at', direction: 'desc' };
  let currentSearch = '';

  function showToast(msg, error = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.borderLeftColor = error ? '#ff474c' : '#4dff88';
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 3000);
  }

  function loadUser() {
    const saved = localStorage.getItem('usfans_user');
    if (!saved) return false;
    try {
      currentUser = JSON.parse(saved);
      isAdmin = currentUser.email && currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      console.log('Loaded user:', currentUser.email, 'isAdmin:', isAdmin);
      if (!isAdmin) {
        document.getElementById('actions-header').classList.add('hide-col');
      } else {
        document.getElementById('actions-header').classList.remove('hide-col');
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  async function fetchListings() {
    document.getElementById('loading-state').style.display = 'block';
    try {
      const { data, error } = await supabaseClient
        .from('listings')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;
      allListings = data || [];
      document.getElementById('listing-count').innerHTML = `📊 ${allListings.length} listings`;
      document.getElementById('loading-state').style.display = 'none';

      if (allListings.length === 0) {
        document.getElementById('empty-state').style.display = 'block';
      } else {
        document.getElementById('table-content').style.display = 'block';
        renderTable();
      }
    } catch (err) {
      console.error(err);
      showToast(err.message, true);
    }
  }

  async function deleteListing(id, name) {
    if (!isAdmin) {
      showToast('Only the admin can delete listings.', true);
      return;
    }
    if (!confirm(`Delete "${name}"?`)) return;
    try {
      const { error } = await supabaseClient
        .from('listings')
        .delete()
        .eq('id', id);
      if (error) throw error;
      showToast('Deleted successfully');
      await fetchListings();
    } catch (err) {
      showToast(err.message, true);
    }
  }

  function renderTable() {
    let filtered = [...allListings];
    if (currentSearch) {
      const s = currentSearch.toLowerCase();
      filtered = filtered.filter(item =>
        (item.name || '').toLowerCase().includes(s) ||
        (item.link || '').toLowerCase().includes(s)
      );
    }

    filtered.sort((a, b) => {
      let aVal = a[currentSort.column];
      let bVal = b[currentSort.column];
      if (currentSort.column === 'created_at') {
        aVal = new Date(aVal);
        bVal = new Date(bVal);
      }
      if (aVal < bVal) return currentSort.direction === 'asc' ? -1 : 1;
      if (aVal > bVal) return currentSort.direction === 'asc' ? 1 : -1;
      return 0;
    });

    const tbody = document.getElementById('table-body');
    tbody.innerHTML = filtered.map(item => {
      let images = [];
      if (item.qc_image_url) {
        if (Array.isArray(item.qc_image_url)) {
          images = item.qc_image_url;
        } else if (typeof item.qc_image_url === 'string') {
          images = [item.qc_image_url];
        } else if (typeof item.qc_image_url === 'object') {
          images = Object.values(item.qc_image_url);
        }
      }

      const imageHTML = images.length > 0
        ? `<div class="qc-images">${images.map(url => `<img src="${url}" alt="QC">`).join('')}</div>`
        : '—';

      const deleteCell = isAdmin
        ? `<td><button class="delete-btn" onclick="deleteListing('${item.id}', '${escapeHtml(item.name).replace(/'/g, "\\'")}')">Delete</button></td>`
        : '';

      return `
        <tr>
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td><a href="${escapeHtml(item.link)}" target="_blank" class="product-link">${truncateUrl(item.link)}</a></td>
          <td>${imageHTML}</td>
          <td>${formatDate(item.created_at)}</td>
          ${deleteCell}
        </tr>
      `;
    }).join('');
  }

  function sortTable(column) {
    if (currentSort.column === column) {
      currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.column = column;
      currentSort.direction = 'desc';
    }
    renderTable();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
  }
  function truncateUrl(url, max = 50) {
    if (!url) return '';
    return url.length <= max ? url : url.substring(0, max) + '...';
  }
  function formatDate(date) {
    if (!date) return 'N/A';
    return new Date(date).toLocaleDateString();
  }

  document.getElementById('search-input').addEventListener('input', e => {
    currentSearch = e.target.value;
    renderTable();
  });

  window.deleteListing = deleteListing;
  window.sortTable = sortTable;

  if (!loadUser()) {
    showToast('Please login first on the main page.', true);
    setTimeout(() => { location.href = 'index.html'; }, 2000);
  } else {
    fetchListings();
  }
</script>
</body>
</html>
