<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreadsheet</title>

<style>
body{background:#0f0f10;color:white;font-family:Inter;}
table{width:100%;border-collapse:collapse;}
td,th{padding:10px;border-bottom:1px solid #333;}
img{width:60px;border-radius:8px;}
button{background:red;color:white;border:none;padding:5px 10px;border-radius:6px;}
</style>
</head>

<body>

<h2>My Listings</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Link</th>
<th>Image</th>
<th>Action</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://fzfkroyskrvxkdtfseyl.supabase.co";
const SUPABASE_KEY="YOUR_KEY_HERE";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_EMAILS=["YOUR_EMAIL@gmail.com"];

let user=JSON.parse(localStorage.getItem("user"));

async function load(){

const {data}=await supabaseClient
.from("listings")
.select("*");

document.getElementById("body").innerHTML=data.map(x=>`
<tr>
<td>${x.name}</td>
<td><a href="${x.link}" target="_blank">link</a></td>
<td>${x.image?`<img src="${x.image}">`:"-"}</td>
<td>
<button onclick="del('${x.id}','${x.user_email}')">Delete</button>
</td>
</tr>
`).join("");

}

window.del=async(id,email)=>{

if(!user) return;

if(user.email!==email && !ADMIN_EMAILS.includes(user.email)){
alert("no permission");
return;
}

await supabaseClient
.from("listings")
.delete()
.eq("id",id);

load();
};

load();

</script>

</body>
</html>
